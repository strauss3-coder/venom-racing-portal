  init(){
    const saved = DB.read();
    this.data = saved ? this._merge(SEED(),saved) : SEED();
    if(!saved){
      this.log('Portal created','Your '+BUSINESS.name+' portal is ready to use','sparkles');
      this.persist(true);
    }
  },
  _merge(base,saved){
    const out = Array.isArray(base) ? saved : Object.assign({},base);
    if(Array.isArray(base)) return Array.isArray(saved)?saved:base;
    Object.keys(saved||{}).forEach(k=>{
      const b = base[k], s = saved[k];
      if(b && s && typeof b==='object' && typeof s==='object' && !Array.isArray(b) && !Array.isArray(s)){
        out[k] = Store._merge(b,s);
      }else{
        out[k] = s;
      }
    });
    return out;
  },

  persist(silent){
    this.data.meta.lastSaved = Date.now();
    const ok = DB.write(this.data);
    if(!ok){
      UI.toast('err','Could not save','Browser storage is full. Try removing some images.');
      return false;
    }
    /* mirror the settings documents to Supabase, debounced */
    if(Cloud.on && Cloud.authed){
      clearTimeout(this._st);
      this._st = setTimeout(()=>Cloud.pushSettings(),700);
    }
    if(!silent) UI.savedPing();
    return true;
  },

  /* generic collection helpers ------------------------------------ */
  list(key){ return this.data[key] || []; },
  find(key,id){ return this.list(key).find(r=>r.id===id) || null; },
  insert(key,rec){
    rec.id = rec.id || U.id(key[0]);
    rec.createdAt = rec.createdAt || Date.now();
    rec.updatedAt = Date.now();
    this.data[key].unshift(rec);
    Cloud.pushRecord(key,rec,0);
    this.persist(); this.emit(key);
    return rec;
  },
  update(key,id,patch){
    const rec = this.find(key,id);
    if(!rec) return null;
    Object.assign(rec,patch,{updatedAt:Date.now()});
    Cloud.pushRecord(key,rec,this.list(key).indexOf(rec));
    this.persist(); this.emit(key);
    return rec;
  },
  remove(key,id){
    const i = this.data[key].findIndex(r=>r.id===id);
    if(i<0) return false;
    const rec = this.data[key][i];
    /* clean up any photos this record owned in Storage */
    if(Cloud.on && Cloud.authed){
      const urls = [].concat(rec.images||[],rec.photo||[],rec.image||[]).filter(Boolean);
      urls.forEach(u=>Cloud.removeImage(u));
    }
    this.data[key].splice(i,1);
    Cloud.pushDelete(key,id);
    this.persist(); this.emit(key);
    return true;
  },
  reorder(key,ids){
    const map = {};
    this.list(key).forEach(r=>map[r.id]=r);
    this.data[key] = ids.map(id=>map[id]).filter(Boolean);
    this.list(key).forEach((r,i)=>Cloud.pushRecord(key,r,i));
    this.persist(); this.emit(key);
  },
  patchDoc(key,patch){
    Object.assign(this.data[key],patch);
    this.persist(); this.emit(key);
  },
  /* replaces a whole collection, used by bulk delete and reorder */
  replaceAll(key,list){
    const before = this.list(key).map(r=>r.id);
    this.data[key] = list;
    const after = list.map(r=>r.id);
    before.filter(id=>after.indexOf(id)<0).forEach(id=>Cloud.pushDelete(key,id));
    list.forEach((r,i)=>Cloud.pushRecord(key,r,i));
    this.persist(); this.emit(key);
  },

  /* activity log -------------------------------------------------- */
  log(title,detail,icon,tone){
    this.data.activity = this.data.activity || [];
    const top = this.data.activity[0];
    /* collapse repeat entries so typing in an editor does not flood the log */
    if(top && top.title===title && (Date.now()-top.at) < 120000){
      top.detail = detail; top.at = Date.now();
      Cloud.pushRecord('activity',top,0);
      return;
    }
    const entry = { id:U.id('a'), title, detail, icon:icon||'activity', tone:tone||'', at:Date.now() };
    this.data.activity.unshift(entry);
    Cloud.pushRecord('activity',entry,0);
    if(this.data.activity.length>60) this.data.activity.length = 60;
  },

  /* events -------------------------------------------------------- */
  on(key,fn){ (this.listeners[key] = this.listeners[key]||[]).push(fn); },
  emit(key){
    (this.listeners[key]||[]).forEach(fn=>{try{fn();}catch(e){console.warn(e);}});
    (this.listeners['*']||[]).forEach(fn=>{try{fn();}catch(e){console.warn(e);}});
  },

  /* derived stats -------------------------------------------------- */
  /* Enquiries per day for the last `days` days, oldest first. Derived from
     the records themselves, so it is always true and never needs entering. */
  enquirySeries(days){
    const n = days || 7;
    const out = [], labels = [];
    const day = 86400000, now = new Date(); now.setHours(23,59,59,999);
    const list = this.list('enquiries');
    for(let i=n-1;i>=0;i--){
      const end = now.getTime() - i*day, start = end - day + 1;
      out.push(list.filter(e=>e.createdAt>=start && e.createdAt<=end).length);
      labels.push(new Date(end).toLocaleDateString(BUSINESS.locale,{weekday:'short'}));
    }
    return { values:out, labels:labels, total:out.reduce((a,b)=>a+b,0) };
  },

  stats(){
    return {
      services:this.list('services').filter(s=>s.active).length,
      stages:this.list('stages').filter(s=>s.active).length,
      products:this.list('products').filter(p=>p.active).length,
      brands:this.list('brands').filter(x=>x.active).length,
      faqs:this.list('faqs').filter(f=>f.active).length,
      sections:this.list('pageSections').filter(x=>x.active).length,
      seo:this.list('seo').filter(x=>x.active).length,
      gallery:this.list('gallery').length,
      testimonials:this.list('testimonials').length,
      unread:this.list('enquiries').filter(e=>e.status==='unread').length,
      enquiries:this.list('enquiries').length
    };
  }
};

/* ==================================================================
   5. UI  -  toasts, modal, confirm, lightbox, sortable, uploader
   ================================================================== */
const UI = {
  toast(type,title,msg){
    const wrap = U.el('#toasts');
    const ic = type==='ok' ? `<svg class="check-anim" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M20 6L9 17l-5-5"/></svg>`
      : type==='err' ? ICON.x : type==='warn' ? ICON.warn : ICON.info;
    const t = document.createElement('div');
    t.className = 'toast '+type;
    t.innerHTML = `<div class="toast-ic">${ic}</div><div style="min-width:0"><b>${U.esc(title)}</b>${msg?`<small>${U.esc(msg)}</small>`:''}</div>`;
    wrap.appendChild(t);
    setTimeout(()=>{ t.classList.add('out'); setTimeout(()=>t.remove(),320); }, type==='err'?4600:2900);
  },
  savedPing(){
    clearTimeout(UI._pt);
    UI._pt = setTimeout(()=>UI.toast('ok','Saved','All changes are stored automatically'),120);
  },

  /* Open modals, deepest last. Escape and the body scroll lock both act
     on this stack rather than on whichever listener happened to fire. */
  _stack:[],

  /* Close every open dialog. Modals live in #modalRoot, which the router
     does not touch, so navigating with one open used to leave it sitting
     over the new page blocking every click. */
  closeAll(){
    UI._stack.slice().reverse().forEach(m=>{ try{ m.close(); }catch(e){} });
  },

  _lockBody(){
    if(UI._stack.length===1){
      UI._scrollY = window.scrollY;
      document.body.style.top = '-'+UI._scrollY+'px';
      document.body.classList.add('modal-open');
    }
  },
  _unlockBody(){
    if(UI._stack.length===0){
      document.body.classList.remove('modal-open');
      document.body.style.top = '';
      window.scrollTo(0, UI._scrollY||0);
    }
  },

  modal(opts){
    const root = U.el('#modalRoot');
    const scrim = document.createElement('div');
    scrim.className='modal-scrim';
    scrim.innerHTML = `
      <div class="modal ${opts.size||''}" role="dialog" aria-modal="true">
        <div class="modal-h">
          <div style="min-width:0">
            <h3>${U.esc(opts.title||'')}</h3>
            ${opts.sub?`<p>${U.esc(opts.sub)}</p>`:''}
          </div>
          <button class="x" type="button" data-close aria-label="Close">${ICON.x}</button>
        </div>
        <div class="modal-b">${opts.body||''}</div>
        ${opts.footer===false?'':`<div class="modal-f">${opts.footer||''}</div>`}
      </div>`;

    const restoreFocus = document.activeElement;
    root.appendChild(scrim);

    let closed = false;
    const api = { el:scrim, node:U.el('.modal',scrim), body:U.el('.modal-b',scrim), footer:U.el('.modal-f',scrim) };

    const close = ()=>{
      /* Idempotent. Cancel, the X, the scrim and Escape can all race,
         and onClose must fire exactly once. */
      if(closed) return;
      closed = true;
      const i = UI._stack.indexOf(api);
      if(i>=0) UI._stack.splice(i,1);
      scrim.classList.remove('on');          /* drops pointer-events at once */
      setTimeout(()=>scrim.remove(),320);
      UI._unlockBody();
      try{ if(restoreFocus && restoreFocus.focus) restoreFocus.focus(); }catch(e){}
      if(opts.onClose) opts.onClose();
    };
    api.close = close;

    UI._stack.push(api);
    UI._lockBody();
    requestAnimationFrame(()=>{ if(!closed) scrim.classList.add('on'); });

    /* Delegated, so a body re-rendered after mount still closes. Binding
       each [data-close] once at creation left later ones inert. */
    scrim.addEventListener('click',e=>{
      if(e.target===scrim || (e.target.closest && e.target.closest('[data-close]'))) close();
    });

    if(opts.onMount) opts.onMount(api);
    setTimeout(()=>{
      if(closed || opts.autofocus===false) return;
      const f = U.el('input:not([type=file]),textarea,select',scrim);
      if(f) f.focus();
    },340);
    return api;
  },

  confirm(opts){
    return new Promise(resolve=>{
      const tone = opts.tone||'dan';
      const m = UI.modal({
        size:'sm', title:opts.title||'Are you sure?', autofocus:false,
        body:`<div class="note ${tone==='dan'?'dan':tone==='warn'?'warn':''}" style="align-items:flex-start">
                ${tone==='dan'?ICON.warn:ICON.info}
                <div>${U.esc(opts.message||'')}</div>
              </div>`,
        footer:`<button class="btn" data-close>Cancel</button>
                <div class="sp"><button class="btn btn-${tone==='dan'?'dan':'pri'}" data-yes>${U.esc(opts.confirmText||'Confirm')}</button></div>`,
        onClose:()=>resolve(false)
      });
      U.el('[data-yes]',m.el).addEventListener('click',()=>{ resolve(true); m.close(); });
    });
  },

  lightbox(src){
    const root = U.el('#lightboxRoot');
    const box = document.createElement('div');
    box.className='lightbox';
    box.innerHTML = `<button class="x" type="button" aria-label="Close preview">${ICON.x}</button><img src="${src}" alt="Preview">`;
    root.appendChild(box);
    let closed = false;
    const close = ()=>{
      if(closed) return;
      closed = true;
      /* Removed on every path, not just Escape - closing by click used to
         leave the key listener attached for the life of the page. */
      document.removeEventListener('keydown',esc);
      box.remove();
    };
    const esc = e=>{ if(e.key==='Escape') close(); };
    document.addEventListener('keydown',esc);
    box.addEventListener('click',e=>{ if(e.target===box || e.target.closest('.x')) close(); });
  },

  /* animated counters --------------------------------------------- */
  countUp(node){
    const target = Number(node.dataset.count)||0;
    const prefix = node.dataset.prefix||'';
    const suffix = node.dataset.suffix||'';
    const dur = 850;
    const t0 = performance.now();
    const step = now=>{
      const p = U.clamp((now-t0)/dur,0,1);
      const eased = 1-Math.pow(1-p,3);
      const val = Math.round(target*eased);
      node.textContent = prefix + val.toLocaleString(BUSINESS.locale) + suffix;
      if(p<1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  },
  animateAll(root){
    U.els('[data-count]',root).forEach((n,i)=>setTimeout(()=>UI.countUp(n),i*60));
    U.els('.stat',root).forEach((n,i)=>n.style.animationDelay=(i*55)+'ms');
    U.els('.veh',root).forEach((n,i)=>n.style.animationDelay=Math.min(i*45,500)+'ms');
    U.els('.tst',root).forEach((n,i)=>n.style.animationDelay=Math.min(i*55,500)+'ms');
    U.els('.list-item',root).forEach((n,i)=>n.style.animationDelay=Math.min(i*35,420)+'ms');
    U.els('.meter i',root).forEach(n=>{ const w=n.dataset.w||'0%'; n.style.width='0%'; setTimeout(()=>n.style.width=w,90); });
    U.els('.bar',root).forEach((n,i)=>n.style.animationDelay=(i*55)+'ms');
  },

  /* drag to reorder ----------------------------------------------- */
  sortable(container,itemSel,onDrop){
    let dragEl = null;
    U.els(itemSel,container).forEach(el=>{
      el.setAttribute('draggable','true');
      el.addEventListener('dragstart',e=>{
        dragEl = el; el.classList.add('drag');
        e.dataTransfer.effectAllowed='move';
        try{ e.dataTransfer.setData('text/plain',el.dataset.id||''); }catch(err){}
      });
      el.addEventListener('dragend',()=>{
        el.classList.remove('drag');
        U.els(itemSel,container).forEach(x=>x.classList.remove('overdrop'));
        dragEl=null;
        onDrop(U.els(itemSel,container).map(x=>x.dataset.id));
      });
      el.addEventListener('dragover',e=>{
        e.preventDefault();
        if(!dragEl || dragEl===el) return;
        el.classList.add('overdrop');
        const items = U.els(itemSel,container);
        if(items.indexOf(dragEl) < items.indexOf(el)) el.after(dragEl);
        else el.before(dragEl);
      });
      el.addEventListener('dragleave',()=>el.classList.remove('overdrop'));
    });
  },

  /* image uploader ------------------------------------------------
     Renders a drop zone plus reorderable thumbnails. Calls onChange
     with the new array of data URLs. Works on desktop and mobile. */
  uploader(host,opts){
    const cfg = Object.assign({ max:5, images:[], label:'Drop images here or tap to browse', hint:'', square:false }, opts);
    let imgs = cfg.images.slice();
    const inputId = U.id('file');

    function paint(){
      const full = imgs.length>=cfg.max;
      host.innerHTML = `
        <div class="drop ${full?'':''}" data-pick style="${full?'opacity:.5;pointer-events:none':''}">
          ${ICON.upload}
          <b>${U.esc(cfg.label)}</b>
          <small>${full?`Maximum of ${cfg.max} images reached`:`${imgs.length} of ${cfg.max} used. JPG or PNG. ${U.esc(cfg.hint)}`}</small>
        </div>
        <input type="file" id="${inputId}" accept="image/*" multiple class="hidden">
        <div class="prog hidden" data-prog><i></i></div>
        ${imgs.length?`<div class="${cfg.square?'gal':'thumbs'}" data-thumbs>${imgs.map((src,i)=>`
          <div class="thumb" data-id="${i}" data-idx="${i}">
            <img src="${U.media(src)}" alt="Image ${i+1}" loading="lazy">
            ${i===0&&!cfg.square?`<span class="pri">Main</span>`:''}
            <span class="ord">${i+1}</span>
            <div class="tb">
              <button data-act="view" title="Preview">${ICON.eye}</button>
              <button data-act="replace" title="Replace">${ICON.refresh}</button>
              <button data-act="left" title="Move left">${ICON.sort}</button>
              <button data-act="del" class="dan" title="Delete">${ICON.trash}</button>
            </div>
          </div>`).join('')}</div>`:''}
      `;
      wire();
    }

    async function addFiles(fileList,replaceIdx){
      const files = Array.prototype.slice.call(fileList).filter(f=>/^image\//.test(f.type));
      if(!files.length) return UI.toast('warn','No images found','Please choose JPG or PNG files.');
      const room = replaceIdx==null ? cfg.max-imgs.length : 1;
      const use = files.slice(0,room);
      if(files.length>room) UI.toast('warn','Some images skipped',`Only ${cfg.max} images are allowed.`);
      const prog = U.el('[data-prog]',host);
      prog.classList.remove('hidden');
      const bar = U.el('i',prog);
      for(let i=0;i<use.length;i++){
        try{
          let url = await U.readImage(use[i]);
          url = await Assets.put(url,cfg.bucket);          /* to Storage when connected */
          if(replaceIdx!=null){
            const old = imgs[replaceIdx];
            imgs[replaceIdx] = url;
            Cloud.removeImage(old);
          } else imgs.push(url);
        }catch(err){ UI.toast('err','Upload failed',err.message); }
        bar.style.width = Math.round(((i+1)/use.length)*100)+'%';
      }
      setTimeout(()=>{
        paint();
        cfg.onChange(imgs.slice());
        UI.toast('ok', replaceIdx!=null?'Image replaced':'Images added', imgs.length+' of '+cfg.max+' in use');
      },260);
    }

    function wire(){
      const drop = U.el('[data-pick]',host);
      const input = U.el('#'+inputId,host);
      let replaceIdx = null;
      drop.addEventListener('click',()=>{ replaceIdx=null; input.click(); });
      ['dragenter','dragover'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add('over');}));
      ['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove('over');}));
      drop.addEventListener('drop',e=>{ if(e.dataTransfer.files.length) addFiles(e.dataTransfer.files,null); });
      input.addEventListener('change',()=>{ if(input.files.length) addFiles(input.files,replaceIdx); input.value=''; });

      const thumbs = U.el('[data-thumbs]',host);
      if(!thumbs) return;
      U.on(thumbs,'click','[data-act]',(e,btn)=>{
        e.preventDefault(); e.stopPropagation();
        const idx = Number(btn.closest('.thumb').dataset.idx);
        const act = btn.dataset.act;
        if(act==='view') UI.lightbox(U.media(imgs[idx]));
        if(act==='del'){
          const gone = imgs[idx];
          imgs.splice(idx,1); paint(); cfg.onChange(imgs.slice());
          Cloud.removeImage(gone);
          UI.toast('info','Image removed','');
        }
        if(act==='left'){
          const to = idx===0 ? imgs.length-1 : idx-1;
          const [m] = imgs.splice(idx,1); imgs.splice(to,0,m);
          paint(); cfg.onChange(imgs.slice());
        }
        if(act==='replace'){ replaceIdx = idx; input.click(); }
      });
      UI.sortable(thumbs,'.thumb',order=>{
        const next = order.map(i=>imgs[Number(i)]).filter(Boolean);
        if(next.length===imgs.length){ imgs = next; paint(); cfg.onChange(imgs.slice()); }
      });
    }

    paint();
    return { get:()=>imgs.slice(), set:v=>{imgs=v.slice();paint();} };
  },

  /* single image picker (logo, avatar, banner) --------------------- */
  imagePicker(host,opts){
    const cfg = Object.assign({ value:'', label:'Upload image', h:120, round:false, max:1200 },opts);
    let val = cfg.value;
    const inputId = U.id('f');
    function paint(){
      host.innerHTML = `
        <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">
          <div data-pick style="width:${cfg.round?cfg.h+'px':'auto'};min-width:110px;height:${cfg.h}px;flex-shrink:0;border-radius:${cfg.round?'50%':'var(--r-md)'};overflow:hidden;border:1.6px dashed var(--line-2);background:var(--glass);display:grid;place-items:center;cursor:pointer;position:relative">
            ${val?`<img src="${U.media(val)}" style="width:100%;height:100%;object-fit:cover">`
                 :`<div style="text-align:center;color:var(--text-3);font-size:11.5px;padding:8px">
                      <div style="display:grid;place-items:center;margin-bottom:4px">${ICON.image}</div>${U.esc(cfg.label)}</div>`}
          </div>
          <div class="row" style="gap:8px">
            <button class="btn btn-sm" data-pick>${ICON.upload} ${val?'Replace':'Upload'}</button>
            ${val?`<button class="btn btn-sm btn-ghost" data-view>${ICON.eye} Preview</button>
                   <button class="btn btn-sm btn-dan" data-clear>${ICON.trash} Remove</button>`:''}
          </div>
        </div>
        <input type="file" id="${inputId}" accept="image/*" class="hidden">`;
      const input = U.el('#'+inputId,host);
      U.els('[data-pick]',host).forEach(b=>b.addEventListener('click',()=>input.click()));
      input.addEventListener('change',async()=>{
        const f = input.files[0]; input.value='';
        if(!f) return;
        try{
          const old = val;
          val = await U.readImage(f,cfg.max);
          val = await Assets.put(val,cfg.bucket||'branding');
          paint(); cfg.onChange(val);
          Cloud.removeImage(old);
          UI.toast('ok','Image uploaded','');
        }catch(err){ UI.toast('err','Upload failed',err.message); }
      });
      const v = U.el('[data-view]',host); if(v) v.addEventListener('click',()=>UI.lightbox(U.media(val)));
      const c = U.el('[data-clear]',host);
      if(c) c.addEventListener('click',()=>{ const gone=val; val=''; paint(); cfg.onChange(''); Cloud.removeImage(gone); UI.toast('info','Image removed',''); });
    }
    paint();
    return { get:()=>val };
  },

  /* tag input ----------------------------------------------------- */
  tags(host,values,onChange){
    let list = (values||[]).slice();
    function paint(){
      host.innerHTML = `<div class="tag-in">
        ${list.map((t,i)=>`<span class="tag">${U.esc(t)}<button data-i="${i}" aria-label="Remove">${ICON.x}</button></span>`).join('')}
        <input placeholder="${list.length?'Add another feature':'Type a feature and press Enter'}">
      </div>`;
      const inp = U.el('input',host);
      inp.addEventListener('keydown',e=>{
        if(e.key==='Enter' || e.key===','){
          e.preventDefault();
          const v = inp.value.trim();
          if(v && list.indexOf(v)<0){ list.push(v); paint(); onChange(list.slice()); U.el('input',host).focus(); }
        }
        if(e.key==='Backspace' && !inp.value && list.length){ list.pop(); paint(); onChange(list.slice()); U.el('input',host).focus(); }
      });
      U.on(host,'click','button[data-i]',(e,b)=>{ list.splice(Number(b.dataset.i),1); paint(); onChange(list.slice()); });
    }
    paint();
    return { get:()=>list.slice() };
  },

  skeleton(kind,n=6){
    if(kind==='cards') return `<div class="veh-grid">${Array(n).fill('<div class="sk sk-card"></div>').join('')}</div>`;
    if(kind==='stats') return `<div class="stats">${Array(4).fill('<div class="sk" style="height:112px;border-radius:var(--r-lg)"></div>').join('')}</div>`;
    return `<div class="grid" style="gap:10px">${Array(n).fill('<div class="sk sk-line"></div>').join('')}</div>`;
  }
};

/* ==================================================================
   6. MODULES  -  each page registers itself here.
   Adding a future module needs nothing more than another
   Portal.register({...}) call. The sidebar and router pick it up.
   ================================================================== */
const Portal = {
  modules:[],
  byId:{},
  register(mod){
    this.modules.push(mod);
    this.byId[mod.id] = mod;
    return mod;
  }
};

      </div>

  card(title,sub,bodyHtml,actions,bodyClass){
    return `<div class="card">
      ${title?`<div class="card-h"><div style="min-width:0"><h3>${U.esc(title)}</h3>${sub?`<p>${U.esc(sub)}</p>`:''}</div>${actions?`<div class="sp">${actions}</div>`:''}</div>`:''}
      <div class="card-b ${bodyClass||''}">${bodyHtml}</div>
    </div>`;
  },
  head(title,sub,actions){
    return `<div class="page-head">
      <div><h2>${U.esc(title)}</h2><p>${U.esc(sub)}</p></div>
      ${actions?`<div class="sp">${actions}</div>`:''}
    </div>`;
  },
  empty(icon,title,text,action){
    return `<div class="empty">
      <div class="empty-ic">${ICON[icon]||ICON.inbox}</div>
      <b>${U.esc(title)}</b><p>${U.esc(text)}</p>
      ${action||''}
    </div>`;
  },
  field(label,inner,hint,note){
    return `<div class="field">
      <label>${U.esc(label)}${note?` <em>${U.esc(note)}</em>`:''}</label>
      ${inner}
      ${hint?`<span class="hint">${U.esc(hint)}</span>`:''}
    </div>`;
  },
  input(key,val,ph,type){
    return `<input class="inp" data-k="${key}" type="${type||'text'}" value="${U.esc(val)}" placeholder="${U.esc(ph||'')}">`;
  },
  ta(key,val,ph,rows){
    return `<textarea class="ta" data-k="${key}" rows="${rows||4}" placeholder="${U.esc(ph||'')}">${U.esc(val)}</textarea>`;
  },
  /* `label` is optional and only needed where the select is not already
     wrapped by H.field's <label>, e.g. inline rows in Appearance. */
  sel(key,val,opts,label){
    return `<select class="sel" data-k="${key}"${label?` aria-label="${U.esc(label)}"`:''}>${opts.map(o=>{
      const v = typeof o==='object'?o.v:o, l = typeof o==='object'?o.l:o;
      return `<option value="${U.esc(v)}" ${String(v)===String(val)?'selected':''}>${U.esc(l)}</option>`;
    }).join('')}</select>`;
  },
  sw(key,on,label,sub,tone){
    return `<label class="switch ${tone||''}">
      <input type="checkbox" data-k="${key}" ${on?'checked':''}>
      <span class="track"></span>
      <span><b>${U.esc(label)}</b>${sub?`<small>${U.esc(sub)}</small>`:''}</span>
    </label>`;
  },
  toggleCard(key,on,label,sub,tone,icon){
    return `<div class="toggle-card">
      ${icon?`<div class="li-ic ${tone==='ok'?'ok':tone==='warn'?'warn':'acc'}">${ICON[icon]}</div>`:''}
      <div style="min-width:0"><b style="font-size:13px">${U.esc(label)}</b>${sub?`<small style="display:block;font-size:11.5px;color:var(--text-3)">${U.esc(sub)}</small>`:''}</div>
      <label class="switch ${tone||''}"><input type="checkbox" data-k="${key}" ${on?'checked':''}><span class="track"></span></label>
    </div>`;
  },
  /* binds every [data-k] control inside root to a save function */
  bind(root,getVal,onSave){
    const push = U.debounce(()=>onSave(),450);
    U.els('[data-k]',root).forEach(el=>{
      const k = el.dataset.k;
      const handler = ()=>{
        let v = el.type==='checkbox' ? el.checked : el.value;
        if(el.dataset.type==='number' || el.type==='number') v = Number(v)||0;
        getVal(k,v,el);
        if(el.type==='checkbox' || el.tagName==='SELECT' || el.type==='date' || el.type==='color') onSave();
        else push();
      };
      el.addEventListener(el.type==='checkbox'||el.tagName==='SELECT'?'change':'input',handler);
      if(el.type==='color'||el.type==='date') el.addEventListener('change',handler);
    });
  }
};

        `<button class="btn btn-pri" data-act="add" style="margin-top:4px">${ICON.plus} Add service</button>`)}`;

      const map = {}; Store.list('services').forEach(x=>map[x.id]=x);

      Store.persist(); UI.toast('ok','Order updated','Services reordered');

    U.on(root,'click','[data-pact]',async(e,b)=>{
      const p = Store.find('products',b.dataset.id);
      if(!p) return;
      const act = b.dataset.pact;
      if(act==='edit') return Modules.productForm(p.id);
      if(act==='toggle'){
        Store.update('products',p.id,{active:!p.active});
        Router.refresh(); UI.toast('ok',p.active?'Product hidden':'Product is live','');
      }
      if(act==='del'){
        if(await UI.confirm({title:'Delete this product?',message:'"'+p.name+'" will be removed from your website.',confirmText:'Delete product'})){
          Store.remove('products',p.id);
          Store.log('Product deleted',p.name,'trash','dan');
          Router.refresh(); UI.toast('ok','Product deleted','');
        }
      }
    });
    U.on(root,'click','[data-bract]',async(e,b)=>{
      const x = Store.find('brands',b.dataset.id);
      if(!x) return;
      if(b.dataset.bract==='edit') return Modules.brandForm(x.id);
      if(await UI.confirm({title:'Delete this brand?',message:'"'+x.name+'" will be removed from the marquee.',confirmText:'Delete brand'})){
        Store.remove('brands',x.id);
        Store.log('Brand deleted',x.name,'trash','dan');
        Router.refresh(); UI.toast('ok','Brand deleted','');
      }
    });
    const box = U.el('[data-brt]',root);
    if(box) UI.sortable(box,'.sortrow',ids=>{
      const map = {}; Store.list('brands').forEach(x=>map[x.id]=x);
      Store.data.brands = ids.map(id=>map[id]).filter(Boolean);
      Store.persist(); UI.toast('ok','Order updated','Brands reordered');
    });
  }
});

    : H.empty('question','No questions yet','Add the questions customers ask most and they will appear on your FAQs page.',

        Router.refresh(); UI.toast('ok','Question deleted','');

Portal.register({
  id:'homepage', title:'Homepage Editor', sub:'Hero, sections and content', icon:'home', group:'Website', instant:true,
  tab:'hero',
  render(){
    const h = Store.data.homepage;
    const tabs = [['hero','Hero section'],['about','About section'],['sections','Section headings'],['cta','Call to action']];
    return `
    ${H.head('Homepage Editor','Change the words and images visitors see first. Everything saves as you type.',
      `<button class="btn" data-act="preview">${ICON.eye} Preview hero</button>`)}
    <div class="tabs">${tabs.map(t=>`<button data-tab="${t[0]}" class="${Portal.byId.homepage.tab===t[0]?'on':''}">${t[1]}</button>`).join('')}</div>
    <div id="hpBody"></div>`;
  },
  mount(root){
    const self = Portal.byId.homepage;
    U.on(root,'click','[data-tab]',(e,b)=>{
      self.tab = b.dataset.tab;
      U.els('[data-tab]',root).forEach(x=>x.classList.toggle('on',x.dataset.tab===self.tab));
      self.paint(root);
    });
    U.on(root,'click','[data-act="preview"]',()=>Modules.heroPreview());
    self.paint(root);
  },
  paint(root){
    const h = Store.data.homepage;
    const host = U.el('#hpBody',root);
    const save = ()=>{ Store.persist(); Store.emit('homepage'); };
    /* Keys may be a dotted path, e.g. sections.services.eyebrow, so the
       section-heading fields can write straight into the nested map. */
    const setPath = (k,v)=>{
      const parts = k.split('.');
      let o = h;
      while(parts.length>1){ const p=parts.shift(); o = (o[p] = o[p]||{}); }
      o[parts[0]] = v;
    };
    const bindAll = ()=>H.bind(host,setPath,()=>{ save(); Store.log('Homepage updated','Homepage content was edited','home'); });

    if(this.tab==='hero'){
      host.innerHTML = `
        <div class="grid g2" style="align-items:start">
          <div class="grid" style="gap:14px">
            ${H.card('Hero content','The first thing visitors read',`
              <div class="grid" style="gap:14px">
                ${H.field('Small badge above the title',H.input('heroBadge',h.heroBadge,BUSINESS.copy.heroBadge),'Keep this short. It sits above the main headline.')}
                ${H.field('Hero title',H.ta('heroTitle',h.heroTitle,BUSINESS.copy.heroTitle,2),'Your strongest sales message in one line.')}
                ${H.field('Hero subtitle',H.ta('heroSubtitle',h.heroSubtitle,BUSINESS.copy.heroSubtitle,3))}
              </div>`)}
            ${H.card('Buttons','Where the hero buttons send visitors',`
              <div class="grid g2">
                ${H.field('Main button text',H.input('btn1Text',h.btn1Text,BUSINESS.copy.btn1Text))}
                ${H.field('Main button link',H.input('btn1Link',h.btn1Link,BUSINESS.copy.btn1Link))}
                ${H.field('Second button text',H.input('btn2Text',h.btn2Text,BUSINESS.copy.btn2Text))}
                ${H.field('Second button link',H.input('btn2Link',h.btn2Link,BUSINESS.copy.btn2Link))}
              </div>`)}
          </div>
          <div class="grid" style="gap:14px">
            ${H.card('Hero background image','Shown behind your headline','<div id="heroImg"></div>')}
            ${H.card('Live preview','How the hero will look',`
              <div class="preview">
                <div class="preview-bar"><i></i><i></i><i></i><span>${U.esc(DOMAIN)}</span></div>
                <div class="hero-prev" id="heroPrev"></div>
              </div>`)}
          </div>
        </div>`;
      bindAll();
      UI.imagePicker(U.el('#heroImg',host),{ value:h.heroImage, label:'Upload hero image', h:130, max:1800,
        onChange:v=>{ h.heroImage=v; save(); this.previewHero(host); } });
      this.previewHero(host);
      U.els('[data-k]',host).forEach(el=>el.addEventListener('input',()=>this.previewHero(host)));
    }

    if(this.tab==='about'){
      const slides = Array.isArray(h.showcase) ? h.showcase : [];
      host.innerHTML = `
        <div class="grid g2" style="align-items:start">
          <div class="grid" style="gap:14px">
            ${H.card('About text','The short story shown on your homepage',`
              <div class="grid" style="gap:14px">
                ${H.field('Small label above the title',H.input('aboutEyebrow',h.aboutEyebrow,BUSINESS.copy.aboutEyebrow))}
                ${H.field('Section title',H.input('aboutTitle',h.aboutTitle,BUSINESS.copy.aboutTitle))}
                ${H.field('First paragraph',H.ta('aboutText',h.aboutText,'Tell visitors who you are',6))}
                ${H.field('Second paragraph',H.ta('aboutText2',h.aboutText2,'Optional second paragraph',4),'Leave empty and the website keeps the paragraph already on the page.')}
              </div>`)}
            ${H.card('Button','The link under the about text',`
              <div class="grid g2">
                ${H.field('Button text',H.input('aboutBtnText',h.aboutBtnText,BUSINESS.copy.aboutBtnText))}
                ${H.field('Button link',H.input('aboutBtnLink',h.aboutBtnLink,BUSINESS.copy.aboutBtnLink))}
              </div>`)}
            ${H.card('Accreditation badge','The panel under the carousel',`
              <div class="grid" style="gap:14px">
                ${H.field('Badge title',H.input('badgeTitle',h.badgeTitle,BUSINESS.copy.badgeTitle))}
                ${H.field('Badge text',H.input('badgeText',h.badgeText,BUSINESS.copy.badgeText))}
              </div>`)}
          </div>
          <div class="grid" style="gap:14px">
            ${H.card('About carousel','The rotating photos beside your about text',`
              <div class="grid" style="gap:14px" id="scList">
                ${slides.map((s,i)=>`
                  <div class="card" style="box-shadow:none;background:var(--glass)">
                    <div class="card-b tight">
                      <div id="scImg${i}" style="margin-bottom:10px"></div>
                      ${H.field('Caption',H.input('showcase.'+i+'.label',s.label,'Shown over the photo'))}
                      <div class="row" style="margin-top:8px">
                        <button class="btn btn-sm btn-dan" data-scdel="${i}" ${slides.length<2?'disabled':''}
                          title="${slides.length<2?'A carousel needs at least one photo':'Take this slide out of the carousel'}">${ICON.trash} Remove slide</button>
                      </div>
                    </div>
                  </div>`).join('')}
              </div>
              <div class="row" style="margin-top:12px">
                <button class="btn" data-act="scadd">${ICON.plus} Add a photo</button>
              </div>
              <div class="note" style="margin-top:12px">${ICON.info}<div>The carousel rotates on its own. Two or more photos work best.</div></div>`)}
          </div>
        </div>`;
      bindAll();
      slides.forEach((s,i)=>{
        const box = U.el('#scImg'+i,host);
        if(box) UI.imagePicker(box,{ value:s.url, label:'Upload photo', h:130, max:1600,
          bucket:BUSINESS.buckets.gallery,
          onChange:v=>{ s.url=v; if(!s.alt) s.alt=s.label||''; save(); } });

      U.on(host,'click','[data-act="scadd"]',()=>{
        h.showcase = slides.concat([{ id:U.id('sc'), url:'', label:'', alt:'' }]);
        save(); Router.refresh();
      });
      U.on(host,'click','[data-scdel]',async(e,b)=>{
        const i = Number(b.dataset.scdel);
        if(await UI.confirm({title:'Remove this photo?',
            message:'It is taken out of the carousel on your homepage.',confirmText:'Remove'})){
          h.showcase = slides.filter((_,n)=>n!==i);
          save(); Store.log('About carousel updated',h.showcase.length+' photos','image');
          Router.refresh();
        }
      });
    }

    if(this.tab==='sections'){
      const labels = BUSINESS.vocab.homeSections;
      const secs = h.sections || {};
      host.innerHTML = `
        <div class="note" style="margin-bottom:14px">${ICON.info}<div>Every block on your homepage has a small label, a heading and an intro line. This is where those words are set. Leave a field empty and the website keeps what is already on the page.</div></div>

          ${Object.keys(labels).filter(k=>secs[k]).map(k=>H.card(labels[k],'',`

              ${H.field('Small label',H.input('sections.'+k+'.eyebrow',secs[k].eyebrow,'e.g. Our Expertise'))}
              ${H.field('Heading',H.ta('sections.'+k+'.title',secs[k].title,'The main heading for this block',2))}
              ${H.field('Intro line',H.ta('sections.'+k+'.intro',secs[k].intro,'Optional line under the heading',2),'','optional')}
            </div>`)).join('')}
        </div>`;
      bindAll();
    }

    if(this.tab==='cta'){
      host.innerHTML = `
        ${H.card('Call to action band','The closing prompt at the bottom of your homepage',`
          <div class="grid" style="gap:14px">
            ${H.field('Title',H.input('ctaTitle',h.ctaTitle,BUSINESS.copy.ctaTitle))}
            ${H.field('Supporting text',H.ta('ctaText',h.ctaText,'Send us a message and we will get back to you',2))}
            <div class="grid g2">
              ${H.field('Button text',H.input('ctaBtnText',h.ctaBtnText,BUSINESS.copy.ctaBtnText))}
              ${H.field('Button link',H.input('ctaBtnLink',h.ctaBtnLink,BUSINESS.copy.ctaBtnLink))}
            </div>
          </div>`)}
        <div style="height:14px"></div>
        ${H.card('Preview','',`
          <div class="preview">
            <div class="hero-prev" style="padding:28px 20px">
              <h4 id="ctaT">${U.esc(h.ctaTitle)}</h4>
              <p id="ctaX">${U.esc(h.ctaText)}</p>
              <div class="row"><span class="btn btn-pri" id="ctaB">${U.esc(h.ctaBtnText)}</span></div>
            </div>
          </div>`)}`;
      bindAll();
      U.els('[data-k]',host).forEach(el=>el.addEventListener('input',()=>{
        U.el('#ctaT',host).textContent = h.ctaTitle;
        U.el('#ctaX',host).textContent = h.ctaText;
        U.el('#ctaB',host).textContent = h.ctaBtnText;
      }));
    }
    UI.animateAll(host);
  },
  previewHero(host){
    const h = Store.data.homepage;
    const p = U.el('#heroPrev',host);
    if(!p) return;
    p.innerHTML = `
      ${h.heroImage?`<div class="bgimg" style="background-image:url('${h.heroImage}')"></div>`:''}
      ${h.heroBadge?`<span class="chip acc" style="position:relative;margin-bottom:12px">${U.esc(h.heroBadge)}</span>`:''}
      <h4>${U.esc(h.heroTitle)}</h4>
      <p>${U.esc(h.heroSubtitle)}</p>
      <div class="row">
        <span class="btn btn-pri btn-sm">${U.esc(h.btn1Text||'Button')}</span>
        <span class="btn btn-sm">${U.esc(h.btn2Text||'Button')}</span>
      </div>`;
  }
});

   ================================================================== */
Portal.register({
  id:'gallery', title:'Gallery Manager', sub:'Photos and videos on your gallery page', icon:'image', group:'Website', instant:true,
  badge(st){ return st.gallery ? {text:String(st.gallery),mut:true} : null; },
  state:{ filter:'all' },
  render(){
    const s = this.state;
    const all = Store.list('gallery');
    const cats = BUSINESS.vocab.galleryCats;
    const counts = { all:all.length, image:all.filter(g=>g.type!=='video').length, video:all.filter(g=>g.type==='video').length };
    const list = s.filter==='all' ? all
               : s.filter==='image' ? all.filter(g=>g.type!=='video')
               : s.filter==='video' ? all.filter(g=>g.type==='video')
               : all.filter(g=>g.category===s.filter);

    return `
    ${H.head('Gallery Manager','Everything on your gallery page. Remove what you no longer want, reorder it, and add photos or videos.',
      `<button class="btn" data-act="addvideo">${ICON.plus} Add video</button>
       <button class="btn btn-pri" data-act="addimage">${ICON.upload} Upload photos</button>`)}

    <div class="segbar" style="margin-bottom:14px">
      <button data-gf="all" class="${s.filter==='all'?'on':''}">All<span class="n">${counts.all}</span></button>
      <button data-gf="image" class="${s.filter==='image'?'on':''}">Photos<span class="n">${counts.image}</span></button>
      <button data-gf="video" class="${s.filter==='video'?'on':''}">Videos<span class="n">${counts.video}</span></button>
      ${cats.filter(c=>c!=='Videos'&&all.some(g=>g.category===c)).map(c=>
        `<button data-gf="${U.esc(c)}" class="${s.filter===c?'on':''}">${U.esc(c)}<span class="n">${all.filter(g=>g.category===c).length}</span></button>`).join('')}
    </div>

    <div id="galUp" style="margin-bottom:14px"></div>

    ${list.length ? `<div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px" data-grt>
      ${list.map(g=>`
        <div class="card" data-id="${U.esc(g.id)}" style="box-shadow:none;background:var(--glass)">
          <div style="position:relative">
            ${g.type==='video'
              ? `<video src="${U.esc(U.media(g.url))}" muted playsinline preload="metadata" style="width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:var(--r-xs) var(--r-xs) 0 0;background:#000"></video>`
              : `<img src="${U.esc(U.media(g.url))}" alt="${U.esc(g.alt||g.label||'')}" loading="lazy" style="width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:var(--r-xs) var(--r-xs) 0 0">`}
            <span class="chip ${g.type==='video'?'acc':''}" style="position:absolute;top:8px;left:8px">${g.type==='video'?ICON.eye+' Video':ICON.image+' Photo'}</span>
            <span class="drag-handle" style="position:absolute;top:8px;right:8px;cursor:grab">${ICON.grip}</span>
          </div>
          <div class="card-b tight">
            <input class="inp" data-gl="${U.esc(g.id)}" value="${U.esc(g.label||'')}" placeholder="Caption" aria-label="Caption" style="margin-bottom:6px">
            <select class="sel" data-gc="${U.esc(g.id)}" aria-label="Category">
              ${cats.map(c=>`<option value="${U.esc(c)}" ${g.category===c?'selected':''}>${U.esc(c)}</option>`).join('')}
            </select>
            <div class="row" style="margin-top:8px;gap:6px">
              <button class="btn btn-sm" data-gact="preview" data-id="${U.esc(g.id)}" aria-label="Preview" title="Preview">${ICON.eye}</button>
              <button class="btn btn-sm btn-dan" data-gact="del" data-id="${U.esc(g.id)}" aria-label="Remove from website" title="Remove">${ICON.trash}</button>
            </div>
          </div>
        </div>`).join('')}
    </div>
    <div style="margin-top:16px;text-align:center;color:var(--text-3);font-size:12.5px">Showing ${list.length} of ${counts.all} items · drag any tile to reorder</div>`
    : H.empty('image','Nothing in this filter','Upload a photo or add a video and it appears on your gallery page.')}

    <div style="height:14px"></div>
    ${H.card('How this works','',`
      <div class="grid" style="gap:10px">
        <div class="note">${ICON.info}<div>This list <b>is</b> your gallery page. Removing an item here removes it from the website. Photos upload straight to your media storage; videos are added by their address because video files are too large to upload through a browser form.</div></div>
        <div class="note ok">${ICON.check}<div>Large photos are resized automatically so the page stays fast on mobile data.</div></div>
      </div>`)}`;
  },
  mount(root){
    const s = this.state;
    U.on(root,'click','[data-gf]',(e,b)=>{ s.filter=b.dataset.gf; Router.refresh(); });

    /* Uploader kept hidden until asked for: the grid below is the real
       interface now that every existing item is managed here. */
    UI.uploader(U.el('#galUp',root),{
      max:60, images:Store.list('gallery').filter(g=>g.type!=='video').map(g=>g.url), square:true,
      bucket:BUSINESS.buckets.gallery,
      label:'Drop photos here or tap to browse',
      hint:'You can select several at once.',
      onChange:urls=>{
        const byUrl = {}; Store.list('gallery').forEach(g=>{ byUrl[g.url]=g; });
        const videos = Store.list('gallery').filter(g=>g.type==='video');
        const images = urls.map(url => byUrl[url] || { id:U.id('g'), url, type:'image',
          category:BUSINESS.vocab.galleryCats[0], label:'', alt:'' });
        Store.data.gallery = images.concat(videos);
        Store.persist();
        Store.log('Gallery updated',Store.data.gallery.length+' items','image');
        Router.paintBadges(); Router.refresh();
      }
    });

    U.on(root,'click','[data-act="addimage"]',()=>{
      const drop = U.el('#galUp [data-pick]',root) || U.el('#galUp',root);
      if(drop) drop.scrollIntoView({behavior:'smooth',block:'center'});
      UI.toast('info','Upload photos','Use the drop area at the top of this page.');
    });
    U.on(root,'click','[data-act="addvideo"]',()=>Modules.galleryVideoForm());

    U.on(root,'click','[data-gact]',async(e,b)=>{
      const g = Store.find('gallery',b.dataset.id);
      if(!g) return;
      if(b.dataset.gact==='preview'){
        if(g.type==='video') return window.open(U.media(g.url),'_blank','noopener');
        return UI.lightbox(U.media(g.url));
      }
      if(await UI.confirm({title:'Remove from your gallery?',
          message:(g.label||'This item')+' is removed from your gallery page. The file itself is not deleted.',
          confirmText:'Remove'})){
        Store.remove('gallery',g.id);
        Store.log('Gallery item removed',g.label||g.url,'trash','dan');
        Router.refresh(); Router.paintBadges(); UI.toast('ok','Removed','');
      }
    });

    U.on(root,'change','[data-gc]',(e,el)=>{
      const g = Store.find('gallery',el.dataset.gc);
      if(g){ g.category = el.value; Store.persist(); UI.toast('ok','Category updated',g.category); }
    });
    U.on(root,'input','[data-gl]',U.debounce((e,el)=>{
      const g = Store.find('gallery',el.dataset.gl);
      if(g){ g.label = el.value; Store.persist(); }
    },450));

    const box = U.el('[data-grt]',root);
    if(box) UI.sortable(box,'.card',ids=>{
      const map = {}; Store.list('gallery').forEach(g=>map[g.id]=g);
      const moved = ids.map(id=>map[id]).filter(Boolean);
      const rest = Store.list('gallery').filter(g=>ids.indexOf(g.id)<0);
      Store.data.gallery = moved.concat(rest);
      Store.persist(); UI.toast('ok','Order updated','Gallery reordered');
    });
  }
});

/* ==================================================================
   MODULE: Page Sections
   The repeated card lists the website renders on several pages:
   why-choose cards, process steps, trust-bar items, technology chips
   and the specialise grid.
   ================================================================== */
Portal.register({
  id:'sections', title:'Page Sections', sub:'Cards and steps across your pages', icon:'layers', group:'Website', instant:true,
  state:{ page:'index' },
  badge(st){ return st.sections ? {text:String(st.sections),mut:true} : null; },
  render(){
    const s = this.state;
    const all = Store.list('pageSections');
    const pages = BUSINESS.vocab.pages.filter(p=>all.some(x=>x.page===p));
    if(!pages.length) pages.push('index');
    if(pages.indexOf(s.page)<0) s.page = pages[0];
    const mine = all.filter(x=>x.page===s.page);
    const types = BUSINESS.vocab.sectionTypes.filter(t=>mine.some(x=>x.section===t.v));

    return `
    ${H.head('Page Sections','The repeating cards and steps on your website. Edit the words here and the page follows.',
      `<button class="btn btn-pri" data-act="add">${ICON.plus} Add item</button>`)}

    <div class="segbar" style="margin-bottom:18px">
      ${pages.map(p=>`<button data-pg="${U.esc(p)}" class="${s.page===p?'on':''}">${U.esc(p)}.html<span class="n">${all.filter(x=>x.page===p).length}</span></button>`).join('')}
    </div>

    ${types.length ? types.map(t=>{
      const items = mine.filter(x=>x.section===t.v);
      return H.card(t.l, items.length+' on '+t.where,
        `<div data-sec="${U.esc(t.v)}">${items.map(x=>`
          <div class="sortrow" data-id="${U.esc(x.id)}">
            <span class="drag-handle">${ICON.grip}</span>
            <div style="min-width:0;flex:1">
              <b style="font-size:13.5px;display:block">${U.esc(x.title)}</b>
              ${x.body?`<small style="font-size:11.5px;color:var(--text-3);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${U.esc(x.body)}</small>`:''}
            </div>
            ${x.active?'':`<span class="chip warn"><i></i>Hidden</span>`}
            <button class="btn btn-sm" data-xact="edit" data-id="${U.esc(x.id)}" aria-label="Edit ${U.esc(x.title)}" title="Edit">${ICON.edit}</button>
            <button class="btn btn-sm btn-dan" data-xact="del" data-id="${U.esc(x.id)}" aria-label="Delete ${U.esc(x.title)}" title="Delete">${ICON.trash}</button>
          </div>`).join('')}</div>`,'','flush');
    }).join('<div style="height:14px"></div>')
    : H.empty('layers','Nothing on this page yet','Add a card or a step and it appears on this page of your website.',
        `<button class="btn btn-pri" data-act="add" style="margin-top:4px">${ICON.plus} Add item</button>`)}`;
  },
  mount(root){
    const s = this.state;
    U.on(root,'click','[data-pg]',(e,b)=>{ s.page=b.dataset.pg; Router.refresh(); });
    U.on(root,'click','[data-act="add"]',()=>Modules.sectionForm(null,s.page));
    U.on(root,'click','[data-xact]',async(e,b)=>{
      const x = Store.find('pageSections',b.dataset.id);
      if(!x) return;
      if(b.dataset.xact==='edit') return Modules.sectionForm(x.id);
      if(await UI.confirm({title:'Delete this item?',message:'"'+x.title+'" is removed from '+x.page+'.html.',confirmText:'Delete item'})){
        Store.remove('pageSections',x.id);
        Store.log('Section item deleted',x.title,'trash','dan');
        Router.refresh(); UI.toast('ok','Item deleted','');
      }
    });
    U.els('[data-sec]',root).forEach(box=>UI.sortable(box,'.sortrow',ids=>{
      const map = {}; Store.list('pageSections').forEach(x=>map[x.id]=x);
      const moved = ids.map(id=>map[id]).filter(Boolean);
      const rest = Store.list('pageSections').filter(x=>ids.indexOf(x.id)<0);
      Store.data.pageSections = moved.concat(rest);
      Store.persist(); UI.toast('ok','Order updated','Section reordered');
    }));
  }
});

/* ==================================================================
   MODULE: Enquiries
   ================================================================== */
Portal.register({
  id:'enquiries', title:'Enquiries', sub:'Leads from your website', icon:'inbox', group:'Customers', instant:true,
  badge(st){ return st.unread ? {text:String(st.unread)} : null; },
  state:{ tab:'all', q:'' },
  render(){
    const s = this.state;
    const all = Store.list('enquiries');
    const counts = { all:all.length };
    BUSINESS.vocab.enquiryStatuses.forEach(k=>{ counts[k] = all.filter(e=>e.status===k).length; });
    let list = s.tab==='all' ? all.slice() : all.filter(e=>e.status===s.tab);
    if(s.q){
      const q = s.q.toLowerCase();
      list = list.filter(e=>[e.name,e.phone,e.email,e.make,e.model,e.registration,e.service,e.vehicle,e.message].join(' ').toLowerCase().indexOf(q)>=0);
    }
    list.sort((a,b)=>b.createdAt-a.createdAt);

    return `
    ${H.head('Enquiries','Every message from your website, WhatsApp and phone in one place.',`
      <button class="btn" data-act="export">${ICON.download} Export CSV</button>
      <button class="btn btn-pri" data-act="add">${ICON.plus} Log an enquiry</button>`)}

    <div class="stats" style="margin-bottom:18px">
      ${H.stat({label:'Unread',count:counts.unread,icon:'inbox',tone:counts.unread?'dan':'ok',sub:'<span>Need a reply</span>'})}
      ${H.stat({label:'In progress',count:counts.contacted+counts.quoted,icon:'phone',tone:'warn',sub:`<span>${counts.quoted} quoted</span>`})}
      ${H.stat({label:'Booked in',count:counts.booked,icon:'calendar',tone:'vio',sub:'<span>Work scheduled</span>'})}
      ${H.stat({label:'Total enquiries',count:counts.all,icon:'users',sub:'<span>All time</span>'})}
    </div>

    <div class="filters">
      <label class="search">${ICON.search}<input id="eq" placeholder="Search by name, number or vehicle" value="${U.esc(s.q)}"></label>
      <div class="segbar">
        ${[['all','All'],['unread','Unread'],['contacted','Contacted'],['quoted','Quoted'],['booked','Booked'],['completed','Completed']]
          .map(t=>`<button data-etab="${t[0]}" class="${s.tab===t[0]?'on':''}">${t[1]}<span class="n">${counts[t[0]]}</span></button>`).join('')}
      </div>
    </div>

    ${list.length ? `<div class="card"><div class="card-b flush"><div class="tbl-wrap">
      <table class="tbl">
        <thead><tr><th>Customer</th><th>Vehicle</th><th>Service</th><th>Contact</th><th>Received</th><th>Status</th><th style="text-align:right">Actions</th></tr></thead>
        <tbody>
          ${list.map(e=>`<tr class="${e.status==='unread'?'unread':''}" data-eopen="${e.id}" style="cursor:pointer">
            <td>
              <div style="display:flex;align-items:center;gap:10px">
                <div class="avatar" style="width:30px;height:30px;font-size:11px">${U.esc(U.initials(e.name))}</div>
                <div style="min-width:0"><b>${U.esc(e.name)}</b><div class="mut">${e.demo?'Sample record':U.esc(e.source||'Website')}</div></div>
              </div>
            </td>
            <td><span class="chip">${ICON.car} ${U.esc(e.vehicle||[e.make,e.model].filter(Boolean).join(' ')||'Not given')}</span>${e.registration?`<div class="mut">${U.esc(e.registration)}</div>`:''}</td>
            <td>${e.service?`<span class="chip acc">${U.esc(e.service)}</span>`:'<span class="mut">General enquiry</span>'}</td>
            <td><div>${U.esc(e.phone||'')}</div><div class="mut">${U.esc(e.email||'')}</div></td>
            <td><div>${U.ago(e.createdAt)}</div><div class="mut">${U.dateTime(e.createdAt)}</div></td>
            <td><span class="chip ${Modules.enquiryTone(e.status)}"><i></i>${e.status.charAt(0).toUpperCase()+e.status.slice(1)}</span></td>
            <td>
              <div class="row" style="justify-content:flex-end;gap:5px;flex-wrap:nowrap">
                <button class="btn btn-sm btn-icon" data-eact="view" data-id="${e.id}" title="Open">${ICON.eye}</button>
                <button class="btn btn-sm btn-icon" data-eact="wa" data-id="${e.id}" title="Reply on WhatsApp">${ICON.whatsapp}</button>
                <button class="btn btn-sm btn-icon" data-eact="mail" data-id="${e.id}" title="Reply by email">${ICON.mail}</button>
                <button class="btn btn-sm btn-icon btn-dan" data-eact="del" data-id="${e.id}" title="Delete">${ICON.trash}</button>
              </div>
            </td>
          </tr>`).join('')}
        </tbody>
      </table></div></div></div>`
    : H.empty('inbox', s.q?'No enquiries match your search':'No enquiries here yet',
        s.q?'Try a different name, number, vehicle or service.':'When a customer sends a message from your website it will appear in this list.')}`;
  },
  mount(root){
    const s = this.state;
    const q = U.el('#eq',root);
    if(q) q.addEventListener('input',U.debounce(()=>{ s.q=q.value; Router.refresh(); },260));
    U.on(root,'click','[data-etab]',(e,b)=>{ s.tab=b.dataset.etab; Router.refresh(); });
    U.on(root,'click','[data-act="export"]',()=>Modules.exportEnquiries());
    U.on(root,'click','[data-act="add"]',()=>Modules.enquiryForm());
    U.on(root,'click','[data-eopen]',(e,tr)=>{ if(!e.target.closest('[data-eact]')) Modules.enquiryView(tr.dataset.eopen); });
    U.on(root,'click','[data-eact]',async(e,b)=>{
      e.stopPropagation();
      const en = Store.find('enquiries',b.dataset.id);
      if(!en) return;
      const act = b.dataset.eact;
      if(act==='view') return Modules.enquiryView(en.id);
      if(act==='wa'){
        const n = (en.phone||'').replace(/[^0-9]/g,'').replace(/^0/,'27');
        if(!n) return UI.toast('warn','No phone number','This enquiry has no number saved.');
        window.open('https://wa.me/'+n+'?text='+encodeURIComponent(BUSINESS.templates.whatsappReply(en)),'_blank','noopener');
        if(en.status==='unread'){ Store.update('enquiries',en.id,{status:'contacted'}); Router.refresh(); }
      }
      if(act==='mail'){
        if(!en.email) return UI.toast('warn','No email address','This enquiry has no email saved.');
        window.location.href = 'mailto:'+en.email+'?subject='+encodeURIComponent(BUSINESS.templates.emailSubject(en))+'&body='+encodeURIComponent(BUSINESS.templates.emailReply(en));
        if(en.status==='unread'){ Store.update('enquiries',en.id,{status:'contacted'}); Router.refresh(); }
      }
      if(act==='del'){
        if(await UI.confirm({title:'Delete this enquiry?',message:'The message from '+en.name+' will be permanently removed.',confirmText:'Delete enquiry'})){
          Store.remove('enquiries',en.id);
          Store.log('Enquiry deleted','Message from '+en.name+' was removed','trash','dan');
          Router.refresh(); UI.toast('ok','Enquiry deleted','');
        }
      }
    });
  }
});

  },
  mount(root){
    const result = U.el('#sbResult',root);

    /* confirm the signed in account is actually allowed to see the data */
    if(Cloud.authed){
      Cloud.isOwner().then(owner=>{
        const slot = U.el('[data-owner-state]',root);
        if(!slot) return;
        if(owner === true) slot.innerHTML = 'Owner access confirmed';
        else if(owner === false){
          slot.innerHTML = '<b style="color:#F5949B">Not on the owner allowlist</b>';
          const help = document.createElement('button');
          help.className = 'btn btn-sm btn-dan';
          help.style.marginTop = '8px';
          help.innerHTML = ICON.warn+' Fix access';
          help.addEventListener('click',()=>Modules.ownerHelp());
          slot.parentNode.appendChild(help);
        }else slot.innerHTML = 'Could not check owner access';
      });
    }

    U.on(root,'click','[data-act="save"]',async(e,btn)=>{
      const url = Cloud.normaliseUrl(U.el('#sbUrl',root).value);
      const key = U.el('#sbKey',root).value.trim();
      if(!/^https:\/\/.+/.test(url)) return result.innerHTML = `<div class="note dan">${ICON.warn}<div>The project URL must start with https:// and look like https://yourproject.supabase.co</div></div>`;
      if(key.length < 40) return result.innerHTML = `<div class="note dan">${ICON.warn}<div>That anon key looks too short. Copy the full key from Project Settings, API.</div></div>`;
      btn.disabled = true;
      result.innerHTML = `<div class="note">${ICON.refresh}<div>Testing the connection...</div></div>`;
      const prev = Cloud.cfg;
      Cloud.setCfg(url,key);
      try{
        await Cloud.ping();
        result.innerHTML = `<div class="note ok">${ICON.check}<div><b>Connection works.</b> The tables are in place.${Cloud.authed?' You are signed in and syncing.':' Sign in with your Supabase account to start syncing.'}</div></div>`;
        Cloud.setStatus(Cloud.authed?'online':'signedout');
        Store.log('Database connected','Portal linked to a Supabase project','db','ok');
        Store.persist(true);
        Shell.paintStatus(); Router.paintBadges();
      }catch(err){
        const hint = /schema|does not exist|relation/i.test(err.message)
          ? 'The project answered but the tables are missing. Run supabase-schema.sql in the SQL Editor first.'
          : /Failed|connection/i.test(err.message)
            ? 'Could not reach that URL. Check the project URL and your internet.'
            : err.message;
        result.innerHTML = `<div class="note dan">${ICON.warn}<div><b>Connection failed.</b> ${U.esc(hint)}</div></div>`;
        if(prev) Cloud.setCfg(prev.url,prev.key); else Cloud.disconnect();
      }finally{ btn.disabled = false; }
    });

    U.on(root,'click','[data-act="disconnect"]',async()=>{
      if(await UI.confirm({title:'Forget this connection?',message:'The saved project details and your session are cleared from this browser, and you will be signed out. Nothing in Supabase is deleted.',confirmText:'Forget and sign out',tone:'warn'})){
        Cloud.disconnect();
        Shell.lock('Connection cleared. Sign in again to continue.');
        UI.toast('info','Connection cleared','');
      }
    });

    U.on(root,'click','[data-act="push"]',async()=>{
      const ok = await UI.confirm({
        title:'Push your content to the database?',
        message:'Your services, stages, products, brands, FAQs, reviews, enquiries and settings are written to Supabase. Anything already in the database with the same id is overwritten.',
        confirmText:'Push to database', tone:'warn'
      });
      if(!ok) return;
      try{
        const c = await Cloud.pushAll();
        Store.log('Content pushed to database',c.vehicles+' vehicles and '+c.enquiries+' enquiries uploaded','upload','ok');
        Store.persist(true); Router.refresh();
        UI.toast('ok','Pushed to the database',Object.values(c||{}).reduce((a,b)=>a+b,0)+' records');
      }catch(err){ UI.toast('err','Push failed',err.message); }
    });

    U.on(root,'click','[data-act="pull"]',async()=>{
      const ok = await UI.confirm({
        title:'Replace this device with the database copy?',
        message:'Everything currently in this browser is replaced by what is in Supabase. Any change on this device that has not synced yet will be lost.',
        confirmText:'Load from database', tone:'warn'
      });
      if(!ok) return;
      try{
        await Cloud.pullAll();
        Shell.applyTheme(); Router.buildNav(); Router.go('database');
        UI.toast('ok','Loaded from the database','');
      }catch(err){ UI.toast('err','Could not load',err.message); }
    });

    U.on(root,'click','[data-act="killdemo"]',async()=>{
      const n = ['testimonials','enquiries'].reduce((a,k)=>a+Store.list(k).filter(r=>r.demo).length,0);
      const ok = await UI.confirm({
        title:'Delete all sample records?',
        message:'All '+n+' placeholder records are removed, including the fabricated vehicles, reviews and enquiries. Your own content and your settings are untouched.',
        confirmText:'Delete sample records'
      });
      if(!ok) return;
      ['testimonials','enquiries'].forEach(k=>{
        Store.replaceAll(k,Store.list(k).filter(r=>!r.demo));
      });
      Store.log('Sample records deleted','Placeholder content was cleared out','trash','warn');
      Store.persist(true); Router.refresh();
      UI.toast('ok','Sample records deleted','The portal now holds only your own content');
    });

    U.on(root,'click','[data-act="sql"]',()=>{
      UI.modal({ size:'lg', title:'Database schema', sub:'Run this once in the Supabase SQL Editor', autofocus:false,
        body:`<div class="grid" style="gap:12px">
          <div class="note">${ICON.info}<div>Safe to run more than once. Use the Copy button below rather than selecting this text, because some editors turn a double dash into an em dash and that breaks SQL.</div></div>
          <div class="code" style="max-height:420px">${U.esc(Modules.schemaSummary())}</div>
        </div>`,
        footer:`<button class="btn" data-close>Close</button><div class="sp"><button class="btn" data-dl>${ICON.download} Download</button><button class="btn btn-pri" data-cp>${ICON.copy} Copy the schema</button></div>`,
        onMount(api){

          U.el('[data-cp]',api.el).addEventListener('click',()=>Modules.copySchema());
        }
      });
    });
    U.on(root,'click','[data-act="dlsql"]',()=>Modules.downloadSchemaNote());
    U.on(root,'click','[data-act="copysql"]',()=>Modules.copySchema());
    U.on(root,'click','[data-act="copysnips"]',()=>{
      const url = Cloud.on ? Cloud.cfg.url : 'https://YOUR-PROJECT.supabase.co';
      const txt = Modules.websiteSnippets(url);
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(txt).then(
          ()=>UI.toast('ok','Copied','Paste this into your website code'),
          ()=>U.save(BUSINESS.slug+'-website-snippets.js',txt,'text/javascript')
        );
      }else U.save(BUSINESS.slug+'-website-snippets.js',txt,'text/javascript');
    });
  }
});

create or replace function public.touch_updated_at()
returns trigger
language plpgsql
as $$
begin
  new.updated_at = now();
  return new;
end;
$$;

do $$
declare t text;
begin
  foreach t in array array['site_settings','services','stages','products','brands','faqs','page_sections','seo','testimonials','enquiries']
  loop
    execute format('drop trigger if exists touch_%1$s on public.%1$s', t);
    execute format(
      'create trigger touch_%1$s before update on public.%1$s
       for each row execute function public.touch_updated_at()', t);
  end loop;
end $$;

/* ==================================================================
   MODULES  -  shared actions, forms and dialogs used across pages
   ================================================================== */
const Modules = {

  /* Chip tone per enquiry status, so the table, detail view and any
     future surface stay in step. */
  enquiryTone(status){
    return status==='unread' ? 'acc'
      : status==='contacted' ? 'warn'
      : status==='quoted' ? 'warn'
      : status==='booked' ? 'vio'
      : 'ok';
  },

  /* ---------- live website panel ---------------------------------- */

  /* The sections the website reads, in the order they appear on it. */
  LIVE_SECTIONS:[
    ['services','Services','wrench','performance.html and services.html'],
    ['stages','Performance stages','stage','performance.html'],
    ['products','Products','additive','performance.html'],
    ['brands','Brands','shield','performance.html'],
    ['testimonials','Reviews','star','reviews.html and the homepage'],
    ['faqs','FAQs','question','faqs.html and the homepage'],
    ['pageSections','Page sections','layers','cards and steps across your pages'],
    ['seo','SEO','search','the title and preview for every page']
  ],

  /* Compares what is live on the website against what is in the portal, so
     "is this connected?" has a factual answer instead of a hopeful one. */
  async paintLivePanel(){
    const host = U.el('#livePanel');
    if(!host) return;

    if(!Cloud.authed){
      host.innerHTML = `<div class="note warn">${ICON.warn}<div>Sign in to see what is live on your website.</div></div>`;
      return;
    }

    const live = await Cloud.liveCounts();

    if(!live._reachable){
      host.innerHTML = `<div class="note dan">${ICON.warn}<div>
        <b>Cannot reach your database.</b> Your website is still up and showing its built-in content,
        but nothing you change here will appear until the connection returns.</div></div>`;
      return;
    }

    let behind = 0, published = 0;
    const rows = Modules.LIVE_SECTIONS.map(([key,label,icon,where])=>{
      const portal = Store.list(key).filter(r=>{
        if(r.demo) return false;
        if('active' in r) return r.active;
        return true;
      }).length;
      const onSite = live[key] == null ? 0 : live[key];
      published += onSite;
      const synced = onSite === portal;
      if(!synced) behind++;
      const tone = portal === 0 ? '' : synced ? 'ok' : 'warn';
      return `<div class="list-item" style="padding:10px 4px">
        <div class="li-ic ${tone||'acc'}">${ICON[icon]||ICON.globe}</div>
        <div class="li-b">
          <b>${U.esc(label)}</b>
          <small>${portal===0 ? 'Nothing added yet' : (synced ? 'Live on '+U.esc(where) : 'Changed in the portal, not published yet')}</small>
        </div>
        <div class="li-t">
          ${portal===0
            ? `<span class="chip">0</span>`
            : synced
              ? `<span class="chip ok"><i></i>${onSite} live</span>`
              : `<span class="chip warn"><i></i>${onSite} live of ${portal}</span>`}
        </div>
      </div>`;
    }).join('');

    const banner = behind === 0
      ? `<div class="note keep" style="border-left:3px solid var(--success);background:var(--success-soft)">
           ${ICON.checkCircle}<div><b>Your website is up to date.</b>
           ${published} records are live at ${U.esc(DOMAIN)}. Anything you edit here appears on the
           site the next time a visitor loads a page.</div></div>`
      : `<div class="note warn">${ICON.warn}<div><b>${behind} section${behind===1?' is':'s are'} not published yet.</b>
           The website is still showing older content for ${behind===1?'it':'them'}. Press
           <b>Publish changes</b> to bring the site in line.</div></div>`;

    host.innerHTML = banner + `<div style="margin-top:6px">${rows}</div>` +
      `<div class="kv" style="margin-top:12px">
         <div class="kv-row"><span>Website address</span><b><a href="${U.esc(BUSINESS.website)}" target="_blank" rel="noopener">${U.esc(DOMAIN)}</a></b></div>
         <div class="kv-row"><span>Database</span><b>Connected</b></div>
         <div class="kv-row"><span>Last published</span><b>${Cloud.lastSync?U.ago(Cloud.lastSync):'Not yet'}</b></div>
       </div>`;
  },

  async publishNow(){
    if(!Cloud.authed) return UI.toast('err','Sign in first','You need to be signed in to publish.');
    const owner = await Cloud.isOwner();
    if(owner !== true) return UI.toast('err','Not on the owner allowlist','Run add-me-as-owner.sql, then sign in again.');
    UI.toast('info','Publishing','Sending your content to the website...');
    try{
      const counts = await Cloud.pushAll();
      const n = Object.values(counts||{}).reduce((a,b)=>a+b,0);
      Store.log('Website published',n+' records were published','upload','ok');
      UI.toast('ok','Website updated',n+' records are now live');
      Modules.paintLivePanel();
      Router.paintBadges();
    }catch(e){
      UI.toast('err','Could not publish',e.message);
    }
  },

  /* Reads the buckets directly rather than tracking uploads separately,
     so the library always reflects what is really in Storage. */
  async paintMedia(){
    const host = U.el('#mediaBody');
    if(!host) return;
    if(!Cloud.authed){
      host.innerHTML = `<div class="note warn">${ICON.warn}<div>Sign in to see your uploaded media.</div></div>`;
      return;
    }
    const buckets = [BUSINESS.buckets.gallery,BUSINESS.buckets.branding];
    let groups;
    try{
      groups = await Promise.all(buckets.map(async b=>({ bucket:b, rows:await Cloud.listBucket(b) })));
    }catch(e){
      host.innerHTML = `<div class="note dan">${ICON.warn}<div><b>Could not reach Storage.</b> ${U.esc(e.message)}</div></div>`;
      return;
    }
    const total = groups.reduce((n,g)=>n+g.rows.length,0);
    if(!total){
      host.innerHTML = H.empty('image','No media uploaded yet',
        'Images you add in Gallery, Products, Brands or SEO appear here.');
      return;
    }
    host.innerHTML = groups.filter(g=>g.rows.length).map(g=>
      H.card(g.bucket, g.rows.length+' file'+(g.rows.length===1?'':'s'),
        `<div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px">
          ${g.rows.map(r=>{
            const url = Cloud.publicUrl(g.bucket,r.name);
            const kb = r.metadata && r.metadata.size ? Math.round(r.metadata.size/1024)+' KB' : '';
            return `<div class="card" style="box-shadow:none;background:var(--glass)">
              <img src="${U.esc(url)}" alt="${U.esc(r.name)}" loading="lazy"
                   style="width:100%;aspect-ratio:1;object-fit:cover;border-radius:var(--r-xs) var(--r-xs) 0 0">
              <div class="card-b tight">
                <div style="font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${U.esc(r.name)}">${U.esc(r.name)}</div>
                <div style="font-size:11px;color:var(--text-3)">${U.esc(kb)}</div>
                <div class="row" style="margin-top:8px;gap:6px">
                  <button class="btn btn-sm" data-mprev="${U.esc(url)}" aria-label="Preview ${U.esc(r.name)}" title="Preview">${ICON.eye}</button>
                  <button class="btn btn-sm" data-mcopy="${U.esc(url)}" aria-label="Copy link to ${U.esc(r.name)}" title="Copy link">${ICON.copy}</button>
                </div>
              </div>
            </div>`;
          }).join('')}
        </div>`)
    ).join('<div style="height:14px"></div>');
  },

  ownerHelp(){
    const sql = "insert into public.portal_owners (user_id, email)\n"
              + "select id, email from auth.users\n"
              + "where email = '" + (Cloud.email || 'your@email.com') + "'\n"
              + "on conflict (user_id) do nothing;\n\n"
              + "select email, added_at from public.portal_owners;";
    UI.modal({
      size:'md', title:'Your account cannot see the data yet', autofocus:false,
      sub:'Signed in successfully, but not yet on the owner allowlist',
      body:`<div class="grid" style="gap:14px">

          You are signed in as <b>${U.esc(Cloud.email||'this account')}</b> and the database answered normally, but it returned nothing at all.
          That is the security rules doing their job: changing content or reading enquiries needs an account listed in <b>portal_owners</b>, and yours is not there yet.
        </div></div>
        <div>
          <label style="font-size:12px;font-weight:600;color:var(--text-2)">Run this once in the Supabase SQL Editor</label>
          <div class="code" style="margin-top:6px">${U.esc(sql)}</div>
        </div>
        <div class="note">${ICON.info}<div>The last line must return exactly one row. Then sign out here and sign back in. Your content on this device has been left untouched, so nothing is lost.</div></div>
      </div>`,
      footer:`<button class="btn" data-close>Close</button>
              <div class="sp">
                <button class="btn" data-copy>${ICON.copy} Copy the SQL</button>
                <button class="btn btn-pri" data-recheck>${ICON.refresh} I have run it, check again</button>
              </div>`,
      onMount(api){
        U.el('[data-copy]',api.el).addEventListener('click',()=>{
          if(navigator.clipboard && navigator.clipboard.writeText){
            navigator.clipboard.writeText(sql).then(
              ()=>UI.toast('ok','Copied','Paste it into the Supabase SQL Editor'),
              ()=>UI.toast('warn','Could not copy','Select the text and copy it by hand')
            );
          }else UI.toast('warn','Could not copy','Select the text and copy it by hand');
        });
        U.el('[data-recheck]',api.el).addEventListener('click',async(e)=>{
          const btn = e.target.closest('button');
          btn.disabled = true; btn.textContent = 'Checking...';
          const owner = await Cloud.isOwner();
          if(owner === true){
            api.close();
            UI.toast('ok','Access granted','Loading your content from the database');
            try{
              await Cloud.pullAll({force:true});
              Shell.applyTheme(); Router.buildNav(); Router.go('dashboard');
            }catch(err){ UI.toast('err','Could not load',err.message); }
          }else{
            btn.disabled = false; btn.innerHTML = ICON.refresh+' Check again';
            UI.toast('warn','Still not on the allowlist',owner===null?(Cloud.lastError||'Could not reach the database'):'Check the email address matches your account exactly');
          }
        });
      }
    });
  },

  exportAll(){
    const stamp = new Date().toISOString().slice(0,10);
    U.save(BUSINESS.slug+'-backup-'+stamp+'.json',JSON.stringify(Store.data,null,2),'application/json');
    Store.log('Backup downloaded','A full backup file was saved','download','ok');
    Store.persist(true);
    UI.toast('ok','Backup downloaded','Keep this file somewhere safe');
  },

  importAll(file){
    if(!file) return;
    const fr = new FileReader();
    fr.onload = async ()=>{
      let parsed;
      try{ parsed = JSON.parse(fr.result); }
      catch(err){ return UI.toast('err','That file could not be read','Please choose a backup file created by this portal.'); }
      if(!parsed || !parsed.meta || !Array.isArray(parsed.vehicles)){
        return UI.toast('err','That is not a portal backup','The file is missing the expected content.');
      }
      const ok = await UI.confirm({
        title:'Restore this backup?',
        message:'Everything currently in your portal will be replaced with the contents of this file. The backup contains '+parsed.vehicles.length+' vehicles and '+((parsed.enquiries||[]).length)+' enquiries.',
        confirmText:'Restore backup', tone:'warn'
      });
      if(!ok) return;
      Store.data = Store._merge(SEED(),parsed);
      Store.log('Backup restored','Portal data was restored from a backup file','upload','ok');
      Store.persist(true);
      Shell.applyTheme(); Router.buildNav(); Router.go('dashboard');
      UI.toast('ok','Backup restored','Your portal has been updated');
    };
    fr.readAsText(file);
  },

  exportEnquiries(){
    const rows = [['Received','Customer','Phone','Email','Make','Model','Registration','Service required','Vehicle','Source','Status','Notes','Message']];
    Store.list('enquiries').slice().sort((a,b)=>b.createdAt-a.createdAt).forEach(e=>rows.push([
      U.dateTime(e.createdAt),e.name,e.phone,e.email,e.make,e.model,e.registration,e.service,e.vehicle,e.source,e.status,e.notes,e.message
    ]));
    U.save(BUSINESS.slug+'-enquiries-'+new Date().toISOString().slice(0,10)+'.csv',U.csv(rows),'text/csv');
    UI.toast('ok','Enquiries exported',rows.length-1+' enquiries saved to CSV');
  },

  exportTestimonials(){

    Store.list('testimonials').forEach(t=>rows.push([U.date(t.createdAt),t.name,t.subject,t.rating,t.source,t.featured?'Yes':'No',t.review]));

    UI.toast('ok','Testimonials exported',rows.length-1+' reviews saved to CSV');
