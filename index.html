const Store = {
  data:null,
  listeners:{},

  init(){
    const saved = DB.read();
    this.data = saved ? this._merge(SEED(),saved) : SEED();
    if(!saved){
      this.log('Portal created','Your '+BUSINESS.name+' portal is ready to use','sparkles');
      this.persist(true);
    }
  },
  _merge(base,saved){
    const out = Array.isArray(base) ? saved : Object.assign({},base);
    if(Array.isArray(base)) return Array.isArray(saved)?saved:base;
    Object.keys(saved||{}).forEach(k=>{
      const b = base[k], s = saved[k];
      if(b && s && typeof b==='object' && typeof s==='object' && !Array.isArray(b) && !Array.isArray(s)){
        out[k] = Store._merge(b,s);
      }else{
        out[k] = s;
      }
    });
    return out;
  },

  persist(silent){
    this.data.meta.lastSaved = Date.now();
    const ok = DB.write(this.data);
    if(!ok){
      UI.toast('err','Could not save','Browser storage is full. Try removing some images.');
      return false;
    }
    /* mirror the settings documents to Supabase, debounced */
    if(Cloud.on && Cloud.authed){
      clearTimeout(this._st);
      this._st = setTimeout(()=>Cloud.pushSettings(),700);
    }
    if(!silent) UI.savedPing();
    return true;
  },

  /* generic collection helpers ------------------------------------ */
  list(key){ return this.data[key] || []; },
  find(key,id){ return this.list(key).find(r=>r.id===id) || null; },
  insert(key,rec){
    rec.id = rec.id || U.id(key[0]);
    rec.createdAt = rec.createdAt || Date.now();
    rec.updatedAt = Date.now();
    this.data[key].unshift(rec);
    Cloud.pushRecord(key,rec,0);
    this.persist(); this.emit(key);
    return rec;
  },
  update(key,id,patch){
    const rec = this.find(key,id);
    if(!rec) return null;
    Object.assign(rec,patch,{updatedAt:Date.now()});
    Cloud.pushRecord(key,rec,this.list(key).indexOf(rec));
    this.persist(); this.emit(key);
    return rec;
  },
  remove(key,id){
    const i = this.data[key].findIndex(r=>r.id===id);
    if(i<0) return false;
    const rec = this.data[key][i];
    /* clean up any photos this record owned in Storage */
    if(Cloud.on && Cloud.authed){
      const urls = [].concat(rec.images||[],rec.photo||[],rec.image||[]).filter(Boolean);
      urls.forEach(u=>Cloud.removeImage(u));
    }
    this.data[key].splice(i,1);
    Cloud.pushDelete(key,id);
    this.persist(); this.emit(key);
    return true;
  },
  reorder(key,ids){
    const map = {};
    this.list(key).forEach(r=>map[r.id]=r);
    this.data[key] = ids.map(id=>map[id]).filter(Boolean);
    this.list(key).forEach((r,i)=>Cloud.pushRecord(key,r,i));
    this.persist(); this.emit(key);
  },
  patchDoc(key,patch){
    Object.assign(this.data[key],patch);
    this.persist(); this.emit(key);
  },
  /* replaces a whole collection, used by bulk delete and reorder */
  replaceAll(key,list){
    const before = this.list(key).map(r=>r.id);
    this.data[key] = list;
    const after = list.map(r=>r.id);
    before.filter(id=>after.indexOf(id)<0).forEach(id=>Cloud.pushDelete(key,id));
    list.forEach((r,i)=>Cloud.pushRecord(key,r,i));
    this.persist(); this.emit(key);
  },

  /* activity log -------------------------------------------------- */
  log(title,detail,icon,tone){
    this.data.activity = this.data.activity || [];
    const top = this.data.activity[0];
    /* collapse repeat entries so typing in an editor does not flood the log */
    if(top && top.title===title && (Date.now()-top.at) < 120000){
      top.detail = detail; top.at = Date.now();
      Cloud.pushRecord('activity',top,0);
      return;
    }
    const entry = { id:U.id('a'), title, detail, icon:icon||'activity', tone:tone||'', at:Date.now() };
    this.data.activity.unshift(entry);
    Cloud.pushRecord('activity',entry,0);
    if(this.data.activity.length>60) this.data.activity.length = 60;
  },

  /* events -------------------------------------------------------- */
  on(key,fn){ (this.listeners[key] = this.listeners[key]||[]).push(fn); },
  emit(key){
    (this.listeners[key]||[]).forEach(fn=>{try{fn();}catch(e){console.warn(e);}});
    (this.listeners['*']||[]).forEach(fn=>{try{fn();}catch(e){console.warn(e);}});
  },

  /* derived stats -------------------------------------------------- */
  stats(){
    const all = this.list('builds');
    const b = all.filter(x=>!x.archived);
    const pub = b.filter(x=>x.published);
    /* Average power gain across builds that actually carry both figures,
       so a half-filled record cannot drag the average to nonsense. */
    const gained = pub.filter(x=>Number(x.powerAfter)>0 && Number(x.powerBefore)>0);
    const gainAvg = gained.length
      ? Math.round(gained.reduce((s,x)=>s+(Number(x.powerAfter)-Number(x.powerBefore)),0)/gained.length)
      : 0;
    return {
      total:b.length,
      published:pub.length,
      drafts:b.filter(x=>!x.published).length,
      featured:b.filter(x=>x.featured && x.published).length,
      archived:all.filter(x=>x.archived).length,
      gainAvg:gainAvg,
      bestGain:gained.length ? Math.max.apply(null,gained.map(x=>Number(x.powerAfter)-Number(x.powerBefore))) : 0,
      services:this.list('services').filter(s=>s.active).length,
      stages:this.list('stages').filter(s=>s.active).length,
      products:this.list('products').filter(p=>p.active).length,
      brands:this.list('brands').filter(x=>x.active).length,
      faqs:this.list('faqs').filter(f=>f.active).length,
      gallery:this.list('gallery').length,
      testimonials:this.list('testimonials').length,
      offersOn:this.list('offers').filter(o=>o.active).length,
      unread:this.list('enquiries').filter(e=>e.status==='unread').length,
      enquiries:this.list('enquiries').length,
      whatsapp:this.data.analytics.whatsappClicks,
      views:b.reduce((s,x)=>s+(Number(x.views)||0),0)
    };
  }
};

/* ==================================================================
   5. UI  -  toasts, modal, confirm, lightbox, sortable, uploader
   ================================================================== */
const UI = {
  toast(type,title,msg){
    const wrap = U.el('#toasts');
    const ic = type==='ok' ? `<svg class="check-anim" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M20 6L9 17l-5-5"/></svg>`
      : type==='err' ? ICON.x : type==='warn' ? ICON.warn : ICON.info;
    const t = document.createElement('div');
    t.className = 'toast '+type;
    t.innerHTML = `<div class="toast-ic">${ic}</div><div style="min-width:0"><b>${U.esc(title)}</b>${msg?`<small>${U.esc(msg)}</small>`:''}</div>`;
    wrap.appendChild(t);
    setTimeout(()=>{ t.classList.add('out'); setTimeout(()=>t.remove(),320); }, type==='err'?4600:2900);
  },
  savedPing(){
    clearTimeout(UI._pt);
    UI._pt = setTimeout(()=>UI.toast('ok','Saved','All changes are stored automatically'),120);
  },

  modal(opts){
    const root = U.el('#modalRoot');
    const scrim = document.createElement('div');
    scrim.className='modal-scrim';
    scrim.innerHTML = `
      <div class="modal ${opts.size||''}" role="dialog" aria-modal="true">
        <div class="modal-h">
          <div style="min-width:0">
            <h3>${U.esc(opts.title||'')}</h3>
            ${opts.sub?`<p>${U.esc(opts.sub)}</p>`:''}
          </div>
          <button class="x" data-close aria-label="Close">${ICON.x}</button>
        </div>
        <div class="modal-b">${opts.body||''}</div>
        ${opts.footer===false?'':`<div class="modal-f">${opts.footer||''}</div>`}
      </div>`;
    root.appendChild(scrim);
    requestAnimationFrame(()=>scrim.classList.add('on'));
    const close = ()=>{
      scrim.classList.remove('on');
      setTimeout(()=>scrim.remove(),320);
      document.removeEventListener('keydown',esc);
      if(opts.onClose) opts.onClose();
    };
    const esc = e=>{ if(e.key==='Escape') close(); };
    document.addEventListener('keydown',esc);
    scrim.addEventListener('click',e=>{ if(e.target===scrim) close(); });
    U.els('[data-close]',scrim).forEach(b=>b.addEventListener('click',close));
    const api = { el:scrim, node:U.el('.modal',scrim), body:U.el('.modal-b',scrim), footer:U.el('.modal-f',scrim), close };
    if(opts.onMount) opts.onMount(api);
    setTimeout(()=>{ const f = U.el('input:not([type=file]),textarea,select',scrim); if(f && opts.autofocus!==false) f.focus(); },340);
    return api;
  },

  confirm(opts){
    return new Promise(resolve=>{
      const tone = opts.tone||'dan';
      const m = UI.modal({
        size:'sm', title:opts.title||'Are you sure?', autofocus:false,
        body:`<div class="note ${tone==='dan'?'dan':tone==='warn'?'warn':''}" style="align-items:flex-start">
                ${tone==='dan'?ICON.warn:ICON.info}
                <div>${U.esc(opts.message||'')}</div>
              </div>`,
        footer:`<button class="btn" data-close>Cancel</button>
                <div class="sp"><button class="btn btn-${tone==='dan'?'dan':'pri'}" data-yes>${U.esc(opts.confirmText||'Confirm')}</button></div>`,
        onClose:()=>resolve(false)
      });
      U.el('[data-yes]',m.el).addEventListener('click',()=>{ resolve(true); m.close(); });
    });
  },

  lightbox(src){
    const root = U.el('#lightboxRoot');
    const box = document.createElement('div');
    box.className='lightbox';
    box.innerHTML = `<button class="x">${ICON.x}</button><img src="${src}" alt="Preview">`;
    root.appendChild(box);
    const close = ()=>box.remove();
    box.addEventListener('click',e=>{ if(e.target===box || e.target.closest('.x')) close(); });
    document.addEventListener('keydown',function h(e){ if(e.key==='Escape'){close();document.removeEventListener('keydown',h);} });
  },

  /* animated counters --------------------------------------------- */
  countUp(node){
    const target = Number(node.dataset.count)||0;
    const prefix = node.dataset.prefix||'';
    const suffix = node.dataset.suffix||'';
    const dur = 850;
    const t0 = performance.now();
    const step = now=>{
      const p = U.clamp((now-t0)/dur,0,1);
      const eased = 1-Math.pow(1-p,3);
      const val = Math.round(target*eased);
      node.textContent = prefix + val.toLocaleString(BUSINESS.locale) + suffix;
      if(p<1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  },
  animateAll(root){
    U.els('[data-count]',root).forEach((n,i)=>setTimeout(()=>UI.countUp(n),i*60));
    U.els('.stat',root).forEach((n,i)=>n.style.animationDelay=(i*55)+'ms');
    U.els('.veh',root).forEach((n,i)=>n.style.animationDelay=Math.min(i*45,500)+'ms');
    U.els('.tst',root).forEach((n,i)=>n.style.animationDelay=Math.min(i*55,500)+'ms');
    U.els('.list-item',root).forEach((n,i)=>n.style.animationDelay=Math.min(i*35,420)+'ms');
    U.els('.meter i',root).forEach(n=>{ const w=n.dataset.w||'0%'; n.style.width='0%'; setTimeout(()=>n.style.width=w,90); });
    U.els('.bar',root).forEach((n,i)=>n.style.animationDelay=(i*55)+'ms');
  },

  /* drag to reorder ----------------------------------------------- */
  sortable(container,itemSel,onDrop){
    let dragEl = null;
    U.els(itemSel,container).forEach(el=>{
      el.setAttribute('draggable','true');
      el.addEventListener('dragstart',e=>{
        dragEl = el; el.classList.add('drag');
        e.dataTransfer.effectAllowed='move';
        try{ e.dataTransfer.setData('text/plain',el.dataset.id||''); }catch(err){}
      });
      el.addEventListener('dragend',()=>{
        el.classList.remove('drag');
        U.els(itemSel,container).forEach(x=>x.classList.remove('overdrop'));
        dragEl=null;
        onDrop(U.els(itemSel,container).map(x=>x.dataset.id));
      });
      el.addEventListener('dragover',e=>{
        e.preventDefault();
        if(!dragEl || dragEl===el) return;
        el.classList.add('overdrop');
        const items = U.els(itemSel,container);
        if(items.indexOf(dragEl) < items.indexOf(el)) el.after(dragEl);
        else el.before(dragEl);
      });
      el.addEventListener('dragleave',()=>el.classList.remove('overdrop'));
    });
  },

  /* image uploader ------------------------------------------------
     Renders a drop zone plus reorderable thumbnails. Calls onChange
     with the new array of data URLs. Works on desktop and mobile. */
  uploader(host,opts){
    const cfg = Object.assign({ max:5, images:[], label:'Drop images here or tap to browse', hint:'', square:false }, opts);
    let imgs = cfg.images.slice();
    const inputId = U.id('file');

    function paint(){
      const full = imgs.length>=cfg.max;
      host.innerHTML = `
        <div class="drop ${full?'':''}" data-pick style="${full?'opacity:.5;pointer-events:none':''}">
          ${ICON.upload}
          <b>${U.esc(cfg.label)}</b>
          <small>${full?`Maximum of ${cfg.max} images reached`:`${imgs.length} of ${cfg.max} used. JPG or PNG. ${U.esc(cfg.hint)}`}</small>
        </div>
        <input type="file" id="${inputId}" accept="image/*" multiple class="hidden">
        <div class="prog hidden" data-prog><i></i></div>
        ${imgs.length?`<div class="${cfg.square?'gal':'thumbs'}" data-thumbs>${imgs.map((src,i)=>`
          <div class="thumb" data-id="${i}" data-idx="${i}">
            <img src="${src}" alt="Image ${i+1}" loading="lazy">
            ${i===0&&!cfg.square?`<span class="pri">Main</span>`:''}
            <span class="ord">${i+1}</span>
            <div class="tb">
              <button data-act="view" title="Preview">${ICON.eye}</button>
              <button data-act="replace" title="Replace">${ICON.refresh}</button>
              <button data-act="left" title="Move left">${ICON.sort}</button>
              <button data-act="del" class="dan" title="Delete">${ICON.trash}</button>
            </div>
          </div>`).join('')}</div>`:''}
      `;
      wire();
    }

    async function addFiles(fileList,replaceIdx){
      const files = Array.prototype.slice.call(fileList).filter(f=>/^image\//.test(f.type));
      if(!files.length) return UI.toast('warn','No images found','Please choose JPG or PNG files.');
      const room = replaceIdx==null ? cfg.max-imgs.length : 1;
      const use = files.slice(0,room);
      if(files.length>room) UI.toast('warn','Some images skipped',`Only ${cfg.max} images are allowed.`);
      const prog = U.el('[data-prog]',host);
      prog.classList.remove('hidden');
      const bar = U.el('i',prog);
      for(let i=0;i<use.length;i++){
        try{
          let url = await U.readImage(use[i]);
          url = await Assets.put(url,cfg.bucket);          /* to Storage when connected */
          if(replaceIdx!=null){
            const old = imgs[replaceIdx];
            imgs[replaceIdx] = url;
            Cloud.removeImage(old);
          } else imgs.push(url);
        }catch(err){ UI.toast('err','Upload failed',err.message); }
        bar.style.width = Math.round(((i+1)/use.length)*100)+'%';
      }
      setTimeout(()=>{
        paint();
        cfg.onChange(imgs.slice());
        UI.toast('ok', replaceIdx!=null?'Image replaced':'Images added', imgs.length+' of '+cfg.max+' in use');
      },260);
    }

    function wire(){
      const drop = U.el('[data-pick]',host);
      const input = U.el('#'+inputId,host);
      let replaceIdx = null;
      drop.addEventListener('click',()=>{ replaceIdx=null; input.click(); });
      ['dragenter','dragover'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add('over');}));
      ['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove('over');}));
      drop.addEventListener('drop',e=>{ if(e.dataTransfer.files.length) addFiles(e.dataTransfer.files,null); });
      input.addEventListener('change',()=>{ if(input.files.length) addFiles(input.files,replaceIdx); input.value=''; });

      const thumbs = U.el('[data-thumbs]',host);
      if(!thumbs) return;
      U.on(thumbs,'click','[data-act]',(e,btn)=>{
        e.preventDefault(); e.stopPropagation();
        const idx = Number(btn.closest('.thumb').dataset.idx);
        const act = btn.dataset.act;
        if(act==='view') UI.lightbox(imgs[idx]);
        if(act==='del'){
          const gone = imgs[idx];
          imgs.splice(idx,1); paint(); cfg.onChange(imgs.slice());
          Cloud.removeImage(gone);
          UI.toast('info','Image removed','');
        }
        if(act==='left'){
          const to = idx===0 ? imgs.length-1 : idx-1;
          const [m] = imgs.splice(idx,1); imgs.splice(to,0,m);
          paint(); cfg.onChange(imgs.slice());
        }
        if(act==='replace'){ replaceIdx = idx; input.click(); }
      });
      UI.sortable(thumbs,'.thumb',order=>{
        const next = order.map(i=>imgs[Number(i)]).filter(Boolean);
        if(next.length===imgs.length){ imgs = next; paint(); cfg.onChange(imgs.slice()); }
      });
    }

    paint();
    return { get:()=>imgs.slice(), set:v=>{imgs=v.slice();paint();} };
  },

  /* single image picker (logo, avatar, banner) --------------------- */
  imagePicker(host,opts){
    const cfg = Object.assign({ value:'', label:'Upload image', h:120, round:false, max:1200 },opts);
    let val = cfg.value;
    const inputId = U.id('f');
    function paint(){
      host.innerHTML = `
        <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">
          <div data-pick style="width:${cfg.round?cfg.h+'px':'auto'};min-width:110px;height:${cfg.h}px;flex-shrink:0;border-radius:${cfg.round?'50%':'var(--r-md)'};overflow:hidden;border:1.6px dashed var(--line-2);background:var(--glass);display:grid;place-items:center;cursor:pointer;position:relative">
            ${val?`<img src="${val}" style="width:100%;height:100%;object-fit:cover">`
                 :`<div style="text-align:center;color:var(--text-3);font-size:11.5px;padding:8px">
                      <div style="display:grid;place-items:center;margin-bottom:4px">${ICON.image}</div>${U.esc(cfg.label)}</div>`}
          </div>
          <div class="row" style="gap:8px">
            <button class="btn btn-sm" data-pick>${ICON.upload} ${val?'Replace':'Upload'}</button>
            ${val?`<button class="btn btn-sm btn-ghost" data-view>${ICON.eye} Preview</button>
                   <button class="btn btn-sm btn-dan" data-clear>${ICON.trash} Remove</button>`:''}
          </div>
        </div>
        <input type="file" id="${inputId}" accept="image/*" class="hidden">`;
      const input = U.el('#'+inputId,host);
      U.els('[data-pick]',host).forEach(b=>b.addEventListener('click',()=>input.click()));
      input.addEventListener('change',async()=>{
        const f = input.files[0]; input.value='';
        if(!f) return;
        try{
          const old = val;
          val = await U.readImage(f,cfg.max);
          val = await Assets.put(val,cfg.bucket||'branding');
          paint(); cfg.onChange(val);
          Cloud.removeImage(old);
          UI.toast('ok','Image uploaded','');
        }catch(err){ UI.toast('err','Upload failed',err.message); }
      });
      const v = U.el('[data-view]',host); if(v) v.addEventListener('click',()=>UI.lightbox(val));
      const c = U.el('[data-clear]',host);
      if(c) c.addEventListener('click',()=>{ const gone=val; val=''; paint(); cfg.onChange(''); Cloud.removeImage(gone); UI.toast('info','Image removed',''); });
    }
    paint();
    return { get:()=>val };
  },

  /* tag input ----------------------------------------------------- */
  tags(host,values,onChange){
    let list = (values||[]).slice();
    function paint(){
      host.innerHTML = `<div class="tag-in">
        ${list.map((t,i)=>`<span class="tag">${U.esc(t)}<button data-i="${i}" aria-label="Remove">${ICON.x}</button></span>`).join('')}
        <input placeholder="${list.length?'Add another feature':'Type a feature and press Enter'}">
      </div>`;
      const inp = U.el('input',host);
      inp.addEventListener('keydown',e=>{
        if(e.key==='Enter' || e.key===','){
          e.preventDefault();
          const v = inp.value.trim();
          if(v && list.indexOf(v)<0){ list.push(v); paint(); onChange(list.slice()); U.el('input',host).focus(); }
        }
        if(e.key==='Backspace' && !inp.value && list.length){ list.pop(); paint(); onChange(list.slice()); U.el('input',host).focus(); }
      });
      U.on(host,'click','button[data-i]',(e,b)=>{ list.splice(Number(b.dataset.i),1); paint(); onChange(list.slice()); });
    }
    paint();
    return { get:()=>list.slice() };
  },

  skeleton(kind,n=6){
    if(kind==='cards') return `<div class="veh-grid">${Array(n).fill('<div class="sk sk-card"></div>').join('')}</div>`;
    if(kind==='stats') return `<div class="stats">${Array(4).fill('<div class="sk" style="height:112px;border-radius:var(--r-lg)"></div>').join('')}</div>`;
    return `<div class="grid" style="gap:10px">${Array(n).fill('<div class="sk sk-line"></div>').join('')}</div>`;
  }
};

const H = {
  stat(o){

  card(title,sub,bodyHtml,actions,bodyClass){

  head(title,sub,actions){

  },
  empty(icon,title,text,action){

      <b>${U.esc(title)}</b><p>${U.esc(text)}</p>
      ${action||''}
    </div>`;
  },
  field(label,inner,hint,note){
    return `<div class="field">
      <label>${U.esc(label)}${note?` <em>${U.esc(note)}</em>`:''}</label>
      ${inner}
      ${hint?`<span class="hint">${U.esc(hint)}</span>`:''}
    </div>`;
  },
  input(key,val,ph,type){
    return `<input class="inp" data-k="${key}" type="${type||'text'}" value="${U.esc(val)}" placeholder="${U.esc(ph||'')}">`;
  },
  ta(key,val,ph,rows){
    return `<textarea class="ta" data-k="${key}" rows="${rows||4}" placeholder="${U.esc(ph||'')}">${U.esc(val)}</textarea>`;
  },
  /* `label` is optional and only needed where the select is not already
     wrapped by H.field's <label>, e.g. inline rows in Appearance. */
  sel(key,val,opts,label){
    return `<select class="sel" data-k="${key}"${label?` aria-label="${U.esc(label)}"`:''}>${opts.map(o=>{
      const v = typeof o==='object'?o.v:o, l = typeof o==='object'?o.l:o;
      return `<option value="${U.esc(v)}" ${String(v)===String(val)?'selected':''}>${U.esc(l)}</option>`;
    }).join('')}</select>`;
  },
  sw(key,on,label,sub,tone){
    return `<label class="switch ${tone||''}">
      <input type="checkbox" data-k="${key}" ${on?'checked':''}>
      <span class="track"></span>
      <span><b>${U.esc(label)}</b>${sub?`<small>${U.esc(sub)}</small>`:''}</span>
    </label>`;
  },
  toggleCard(key,on,label,sub,tone,icon){
    return `<div class="toggle-card">
      ${icon?`<div class="li-ic ${tone==='ok'?'ok':tone==='warn'?'warn':'acc'}">${ICON[icon]}</div>`:''}
      <div style="min-width:0"><b style="font-size:13px">${U.esc(label)}</b>${sub?`<small style="display:block;font-size:11.5px;color:var(--text-3)">${U.esc(sub)}</small>`:''}</div>
      <label class="switch ${tone||''}"><input type="checkbox" data-k="${key}" ${on?'checked':''}><span class="track"></span></label>
    </div>`;
  },
  /* binds every [data-k] control inside root to a save function */
  bind(root,getVal,onSave){
    const push = U.debounce(()=>onSave(),450);
    U.els('[data-k]',root).forEach(el=>{
      const k = el.dataset.k;
      const handler = ()=>{
        let v = el.type==='checkbox' ? el.checked : el.value;
        if(el.dataset.type==='number' || el.type==='number') v = Number(v)||0;
        getVal(k,v,el);
        if(el.type==='checkbox' || el.tagName==='SELECT' || el.type==='date' || el.type==='color') onSave();
        else push();
      };
      el.addEventListener(el.type==='checkbox'||el.tagName==='SELECT'?'change':'input',handler);
      if(el.type==='color'||el.type==='date') el.addEventListener('change',handler);
    });
  }
};

   Modelled directly on the reference vehicles module: filter bar with

Portal.register({
  id:'builds', title:'Performance Builds', sub:'Proof of work supporting your Performance page', icon:'dyno', group:'Proof of work', skeleton:'cards',
  badge(st){ return st.published ? {text:String(st.published),mut:true} : null; },
  state:{ q:'', tab:'all', make:'', sort:'newest' },
  render(params){
    if(params.q!=null && params.q!=='') this.state.q = params.q;
    const s = this.state;
    const all = Store.list('builds');
    const counts = {
      all:all.filter(b=>!b.archived).length,
      published:all.filter(b=>!b.archived&&b.published).length,
      drafts:all.filter(b=>!b.archived&&!b.published).length,
      featured:all.filter(b=>!b.archived&&b.featured).length,
      archived:all.filter(b=>b.archived).length
    };
    const makes = Array.from(new Set(all.map(b=>b.make).filter(Boolean))).sort();
    const list = Modules.filterBuilds(all,s);

    return `
    ${H.head('Performance Builds','Completed jobs that prove the work on your Performance page. Log the dyno figures and photos for each one.',`
      <button class="btn" data-act="export">${ICON.download} Export CSV</button>
      <button class="btn btn-pri" data-act="add">${ICON.plus} Add build</button>`)}

    <div class="filters">
      <label class="search">${ICON.search}
        <input id="bq" placeholder="Search by title, make, model, stage or engine" value="${U.esc(s.q)}">
      </label>
      <select class="sel" id="bmake" aria-label="Filter builds by vehicle make">
        <option value="">All makes</option>
        ${makes.map(m=>`<option value="${U.esc(m)}" ${m===s.make?'selected':''}>${U.esc(m)}</option>`).join('')}
      </select>
      <select class="sel" id="bsort" aria-label="Sort builds">
        ${[['newest','Newest first'],['oldest','Oldest first'],['gain-hi','Biggest power gain'],['power-hi','Highest final power'],['stage','Stage order'],['views','Most viewed'],['name','Title A to Z']]
          .map(o=>`<option value="${o[0]}" ${s.sort===o[0]?'selected':''}>${o[1]}</option>`).join('')}
      </select>
    </div>

    <div class="segbar" style="margin-bottom:18px">
      ${[['all','All builds'],['published','Published'],['drafts','Drafts'],['featured','Featured'],['archived','Archived']]
        .map(t=>`<button data-tab="${t[0]}" class="${s.tab===t[0]?'on':''}">${t[1]}<span class="n">${counts[t[0]]}</span></button>`).join('')}
    </div>

    ${list.length ? `<div class="veh-grid">${list.map(Modules.buildCard).join('')}</div>`
      : H.empty('stage', s.q||s.make ? 'No builds match your search' : 'No builds in this list yet',
          s.q||s.make ? 'Try a different search term or clear your filters.' : 'Add your first build and it will appear on your website as soon as you publish it.',
          `<button class="btn btn-pri" data-act="add" style="margin-top:4px">${ICON.plus} Add build</button>`)}

    ${list.length?`<div style="margin-top:20px;text-align:center;color:var(--text-3);font-size:12.5px">Showing ${list.length} of ${counts.all} builds${(()=>{const g=list.filter(b=>Number(b.powerAfter)>0&&Number(b.powerBefore)>0);return g.length?' · Average gain +'+Math.round(g.reduce((a,b)=>a+(b.powerAfter-b.powerBefore),0)/g.length)+' kW':'';})()}</div>`:''}
    `;
  },
  mount(root){
    const s = this.state;
    const q = U.el('#bq',root);
    if(q) q.addEventListener('input',U.debounce(()=>{ s.q=q.value; Modules.repaintBuilds(); },220));
    const nm = U.el('#bmake',root); if(nm) nm.addEventListener('change',()=>{ s.make=nm.value; Modules.repaintBuilds(); });
    const ns = U.el('#bsort',root); if(ns) ns.addEventListener('change',()=>{ s.sort=ns.value; Modules.repaintBuilds(); });
    U.on(root,'click','[data-tab]',(e,b)=>{ s.tab=b.dataset.tab; Router.refresh(); });
    U.on(root,'click','[data-act="add"]',()=>Modules.buildForm(null));
    U.on(root,'click','[data-act="export"]',()=>Modules.exportBuilds());
    U.on(root,'click','[data-bact]',(e,b)=>Modules.buildAction(b.dataset.bact,b.dataset.id));
    U.on(root,'click','[data-bopen]',(e,b)=>{
      if(e.target.closest('[data-bact]')) return;
      Modules.buildForm(b.dataset.bopen);
    });
  }
});

Portal.register({

      `<button class="btn btn-pri" data-act="add">${ICON.plus} Add question</button>`)}

        `<div data-frt="${U.esc(cat)}">${list.filter(f=>f.category===cat).map(f=>`
          <div class="sortrow" data-id="${f.id}">

              <b style="font-size:13.5px;display:block">${U.esc(f.question)}</b>

            </div>
            ${f.featured?`<span class="chip acc"><i></i>Homepage</span>`:''}
            ${f.active?'':`<span class="chip warn"><i></i>Hidden</span>`}
            <button class="btn btn-sm" data-fact="edit" data-id="${f.id}" aria-label="Edit this question" title="Edit">${ICON.edit}</button>
            <button class="btn btn-sm btn-dan" data-fact="del" data-id="${f.id}" aria-label="Delete this question" title="Delete">${ICON.trash}</button>
          </div>`).join('')}</div>`,'','flush')}`).join('')
    : H.empty('question','No questions yet','Add the questions customers ask most and they will appear on your FAQs page.',
        `<button class="btn btn-pri" data-act="add" style="margin-top:4px">${ICON.plus} Add question</button>`)}`;
  },
  mount(root){
    U.on(root,'click','[data-act="add"]',()=>Modules.faqForm(null));
    U.on(root,'click','[data-fact]',async(e,b)=>{
      const f = Store.find('faqs',b.dataset.id);
      if(!f) return;
      if(b.dataset.fact==='edit') return Modules.faqForm(f.id);
      if(await UI.confirm({title:'Delete this question?',message:'"'+f.question+'" will be removed from your website.',confirmText:'Delete question'})){
        Store.remove('faqs',f.id);
        Store.log('FAQ deleted',f.question,'trash','dan');
        Router.refresh(); UI.toast('ok','Question deleted','');
      }
    });

      const map = {}; Store.list('faqs').forEach(x=>map[x.id]=x);
      const moved = ids.map(id=>map[id]).filter(Boolean);
      const rest = Store.list('faqs').filter(x=>ids.indexOf(x.id)<0);
      Store.data.faqs = moved.concat(rest);
      Store.persist(); UI.toast('ok','Order updated','Questions reordered');
    }));
  }
});

Portal.register({

  tab:'hero',

    ${H.head('Homepage Editor','Change the words and images visitors see first. Everything saves as you type.',
      `<button class="btn" data-act="preview">${ICON.eye} Preview hero</button>`)}
    <div class="tabs">${tabs.map(t=>`<button data-tab="${t[0]}" class="${Portal.byId.homepage.tab===t[0]?'on':''}">${t[1]}</button>`).join('')}</div>
    <div id="hpBody"></div>`;
  },

    const self = Portal.byId.homepage;
    U.on(root,'click','[data-tab]',(e,b)=>{

    const h = Store.data.homepage;
    const host = U.el('#hpBody',root);
    const save = ()=>{ Store.persist(); Store.emit('homepage'); };
    const bindAll = ()=>H.bind(host,(k,v)=>{ h[k]=v; },()=>{ save(); Store.log('Homepage updated','Homepage content was edited','home'); });

    if(this.tab==='hero'){
      host.innerHTML = `
        <div class="grid g2" style="align-items:start">
          <div class="grid" style="gap:14px">
            ${H.card('Hero content','The first thing visitors read',`
              <div class="grid" style="gap:14px">
                ${H.field('Small badge above the title',H.input('heroBadge',h.heroBadge,BUSINESS.copy.heroBadge),'Keep this short. It sits above the main headline.')}
                ${H.field('Hero title',H.ta('heroTitle',h.heroTitle,BUSINESS.copy.heroTitle,2),'Your strongest sales message in one line.')}
                ${H.field('Hero subtitle',H.ta('heroSubtitle',h.heroSubtitle,'Describe what makes your dealership different',3))}
              </div>`)}
            ${H.card('Buttons','Where the hero buttons send visitors',`
              <div class="grid g2">
                ${H.field('Main button text',H.input('btn1Text',h.btn1Text,BUSINESS.copy.btn1Text))}
                ${H.field('Main button link',H.input('btn1Link',h.btn1Link,BUSINESS.copy.btn1Link))}
                ${H.field('Second button text',H.input('btn2Text',h.btn2Text,BUSINESS.copy.btn2Text))}
                ${H.field('Second button link',H.input('btn2Link',h.btn2Link,BUSINESS.copy.btn2Link))}
              </div>`)}
          </div>
          <div class="grid" style="gap:14px">
            ${H.card('Hero background image','Shown behind your headline','<div id="heroImg"></div>')}
            ${H.card('Live preview','How the hero will look',`
              <div class="preview">
                <div class="preview-bar"><i></i><i></i><i></i><span>${U.esc(DOMAIN)}</span></div>
                <div class="hero-prev" id="heroPrev"></div>
              </div>`)}
          </div>
        </div>`;
      bindAll();
      UI.imagePicker(U.el('#heroImg',host),{ value:h.heroImage, label:'Upload hero image', h:130, max:1800,
        onChange:v=>{ h.heroImage=v; save(); this.previewHero(host); } });
      this.previewHero(host);
      U.els('[data-k]',host).forEach(el=>el.addEventListener('input',()=>this.previewHero(host)));
    }

    if(this.tab==='featured'){
      const avail = Store.list('builds').filter(v=>!v.archived&&v.published);
      const featured = avail.filter(v=>v.featured);
      host.innerHTML = `
        ${H.card('Featured section heading','Text above your featured cars',`
          <div class="grid g2">
            ${H.field('Section title',H.input('featuredTitle',h.featuredTitle,'Featured builds'))}
            ${H.field('Section subtitle',H.input('featuredSub',h.featuredSub,'A selection of recent work from the workshop'))}
          </div>`)}
        <div style="height:14px"></div>
        ${H.card('Choose featured builds','Tick the builds that should appear on your homepage. Drag to change their order.',
          avail.length ? `<div id="featList">${featured.map(v=>Modules.sortRow(v)).join('')}</div>
            ${featured.length?'<div class="sep"></div>':''}
            <div class="grid" style="gap:8px">
              ${avail.filter(v=>!v.featured).map(v=>`
                <div class="toggle-card">
                  ${v.images[0]?`<img class="mini-th" src="${v.images[0]}" alt="">`:`<div class="li-ic">${ICON.car}</div>`}
                  <div style="min-width:0">
                    <b style="font-size:13px">${U.esc(v.name)}</b>
                    <small style="display:block;font-size:11.5px;color:var(--text-3)">${v.year} · ${U.money(v.price)}${v.sold?' · Sold':''}</small>
                  </div>
                  <label class="switch"><input type="checkbox" data-feat="${v.id}"><span class="track"></span></label>
                </div>`).join('')}
            </div>
            ${featured.length===0?`<div class="note" style="margin-top:14px">${ICON.info}<div>No featured builds selected yet. Turn on a few builds above and they will show on your homepage.</div></div>`:''}`
          : H.empty('stage','No published builds to feature','Add and publish a build first, then choose which ones to feature here.'))}`;
      bindAll();
      const fl = U.el('#featList',host);
      if(fl) UI.sortable(fl,'.sortrow',ids=>{
        const map = {}; Store.list('builds').forEach(v=>map[v.id]=v);
        const rest = Store.list('builds').filter(v=>ids.indexOf(v.id)<0);
        Store.data.builds = ids.map(id=>map[id]).filter(Boolean).concat(rest);
        Store.persist(); UI.toast('ok','Order updated','Featured builds reordered');
      });
      U.on(host,'change','[data-feat]',(e,cb)=>{
        Store.update('builds',cb.dataset.feat,{featured:cb.checked});
        Store.log('Featured builds changed',(Store.find('builds',cb.dataset.feat)||{}).title+(cb.checked?' added to':' removed from')+' the homepage','star');
        Store.persist(true); this.paint(root);
      });
      U.on(host,'click','[data-unfeat]',(e,b)=>{
        Store.update('builds',b.dataset.unfeat,{featured:false});
        this.paint(root); UI.toast('info','Removed from featured','');
      });
    }

    if(this.tab==='banners'){
      host.innerHTML = H.card('Homepage banner images','Wide images used across your homepage sections. Up to 5.','<div id="bnrUp"></div>');
      UI.uploader(U.el('#bnrUp',host),{ max:5, images:h.banners||[], bucket:BUSINESS.buckets.branding, label:'Drop banner images here or tap to browse',
        hint:'Wide landscape images work best.',
        onChange:v=>{ h.banners=v; save(); Store.log('Banners updated',v.length+' banner images on the homepage','image'); } });
    }

    if(this.tab==='about'){
      host.innerHTML = `
        <div class="grid g2" style="align-items:start">
          ${H.card('About preview text','The short story shown on your homepage',`
            <div class="grid" style="gap:14px">
              ${H.field('Section title',H.input('aboutTitle',h.aboutTitle,BUSINESS.copy.aboutTitle))}
              ${H.field('About text',H.ta('aboutText',h.aboutText,'Tell visitors who you are',6),'Two or three sentences works best on a homepage.')}
            </div>`)}
          ${H.card('About image','A photo of your dealership or team','<div id="aboutImg"></div>')}
        </div>`;
      bindAll();
      UI.imagePicker(U.el('#aboutImg',host),{ value:h.aboutImage, label:'Upload about image', h:150, onChange:v=>{h.aboutImage=v;save();} });
    }

    if(this.tab==='stats'){
      host.innerHTML = H.card('Homepage statistics','The four numbers shown as proof on your homepage',`
        <div class="grid g2">
          ${h.stats.map((s,i)=>`
            <div class="card" style="box-shadow:none;background:var(--glass)">
              <div class="card-b">
                <div class="grid" style="gap:11px">
                  ${H.field('Number '+(i+1),`<input class="inp" data-si="${i}" data-sk="value" value="${U.esc(s.value)}" placeholder="850+">`)}
                  ${H.field('Label',`<input class="inp" data-si="${i}" data-sk="label" value="${U.esc(s.label)}" placeholder="Years of experience">`)}
                </div>
              </div>
            </div>`).join('')}
        </div>
        <div class="note" style="margin-top:16px">${ICON.info}<div>Use short values such as 850+, 12 or 4.9. These appear as animated counters on your website.</div></div>`);
      const push = U.debounce(()=>{ save(); },400);
      U.els('[data-si]',host).forEach(el=>el.addEventListener('input',()=>{
        h.stats[Number(el.dataset.si)][el.dataset.sk] = el.value; push();
      }));
    }

    if(this.tab==='cta'){
      host.innerHTML = `
        ${H.card('Call to action band','The closing prompt at the bottom of your homepage',`
          <div class="grid" style="gap:14px">
            ${H.field('Title',H.input('ctaTitle',h.ctaTitle,BUSINESS.copy.ctaTitle))}
            ${H.field('Supporting text',H.ta('ctaText',h.ctaText,'Send us a message and we will get back to you',2))}
            <div class="grid g2">
              ${H.field('Button text',H.input('ctaBtnText',h.ctaBtnText,BUSINESS.copy.ctaBtnText))}
              ${H.field('Button link',H.input('ctaBtnLink',h.ctaBtnLink,BUSINESS.copy.ctaBtnLink))}
            </div>
          </div>`)}
        <div style="height:14px"></div>
        ${H.card('Preview','',`
          <div class="preview">
            <div class="hero-prev" style="padding:28px 20px">
              <h4 id="ctaT">${U.esc(h.ctaTitle)}</h4>
              <p id="ctaX">${U.esc(h.ctaText)}</p>
              <div class="row"><span class="btn btn-pri" id="ctaB">${U.esc(h.ctaBtnText)}</span></div>
            </div>
          </div>`)}`;
      bindAll();
      U.els('[data-k]',host).forEach(el=>el.addEventListener('input',()=>{
        U.el('#ctaT',host).textContent = h.ctaTitle;
        U.el('#ctaX',host).textContent = h.ctaText;
        U.el('#ctaB',host).textContent = h.ctaBtnText;
      }));
    }
    UI.animateAll(host);
  },
  previewHero(host){
    const h = Store.data.homepage;
    const p = U.el('#heroPrev',host);
    if(!p) return;
    p.innerHTML = `
      ${h.heroImage?`<div class="bgimg" style="background-image:url('${h.heroImage}')"></div>`:''}
      ${h.heroBadge?`<span class="chip acc" style="position:relative;margin-bottom:12px">${U.esc(h.heroBadge)}</span>`:''}
      <h4>${U.esc(h.heroTitle)}</h4>
      <p>${U.esc(h.heroSubtitle)}</p>
      <div class="row">
        <span class="btn btn-pri btn-sm">${U.esc(h.btn1Text||'Button')}</span>
        <span class="btn btn-sm">${U.esc(h.btn2Text||'Button')}</span>
      </div>`;
  }
});

      if(b.dataset.tact==='feature'){

        Router.refresh(); UI.toast('ok',t.featured?'Pinned to homepage':'Removed from homepage','');

Portal.register({
  id:'offers', title:'Special Offers', sub:'Promotional banners', icon:'tag', group:'Website', instant:true,
  badge(st){ return st.offersOn ? {text:String(st.offersOn)} : null; },
  render(){
    const list = Store.list('offers');
    return `
    ${H.head('Special Offers','Create promotional banners for finance deals, trade-in bonuses and monthly specials.',
      `<button class="btn btn-pri" data-act="add">${ICON.plus} Create offer</button>`)}
    ${list.length ? `<div class="grid g2" style="align-items:start">${list.map(o=>{
      const expired = o.expiry && o.expiry < Date.now();
      const days = o.expiry ? Math.ceil((o.expiry-Date.now())/86400000) : null;
      return `<div class="card lift" data-id="${o.id}">
        <div class="card-b">
          <div class="offer-prev" style="background:linear-gradient(140deg,${o.colour}, ${o.colour}22);${o.active&&!expired?'':'filter:grayscale(.7);opacity:.75'}">
            ${o.image?`<div class="bgimg" style="background-image:url('${o.image}')"></div>`:''}
            <h4>${U.esc(o.title)}</h4>
            <p>${U.esc(o.description)}</p>
            ${o.btnText?`<span class="btn btn-sm" style="background:#fff;color:#111;border-color:transparent;font-weight:700">${U.esc(o.btnText)}</span>`:''}
          </div>
          <div class="row" style="margin-top:14px">
            <span class="chip ${expired?'dan':o.active?'ok':''}"><i></i>${expired?'Expired':o.active?'Live on website':'Switched off'}</span>
            ${o.demo?`<span class="chip dan">Sample</span>`:''}
            ${o.expiry?`<span class="chip">${ICON.calendar} ${expired?'Ended '+U.date(o.expiry):days+' days left'}</span>`:''}
          </div>
        </div>
        <div class="veh-acts">
          <button class="btn btn-sm" data-oact="edit" data-id="${o.id}">${ICON.edit} Edit</button>
          <button class="btn btn-sm ${o.active?'btn-warn':'btn-ok'}" data-oact="toggle" data-id="${o.id}">${o.active?ICON.x+' Switch off':ICON.check+' Switch on'}</button>
          <button class="btn btn-sm" data-oact="dup" data-id="${o.id}" aria-label="Duplicate ${U.esc(o.title)}" title="Duplicate">${ICON.copy}</button>
          <button class="btn btn-sm btn-dan" data-oact="del" data-id="${o.id}" aria-label="Delete ${U.esc(o.title)}" title="Delete">${ICON.trash}</button>
        </div>
      </div>`;
    }).join('')}</div>`
    : H.empty('tag','No offers yet','Create your first promotional banner to highlight a finance deal or monthly special.',
        `<button class="btn btn-pri" data-act="add" style="margin-top:4px">${ICON.plus} Create offer</button>`)}`;
  },
  mount(root){
    U.on(root,'click','[data-act="add"]',()=>Modules.offerForm(null));
    U.on(root,'click','[data-oact]',async(e,b)=>{
      const o = Store.find('offers',b.dataset.id);
      if(!o) return;
      const act = b.dataset.oact;
      if(act==='edit') return Modules.offerForm(o.id);
      if(act==='toggle'){
        Store.update('offers',o.id,{active:!o.active});
        Store.log('Offer '+(o.active?'switched on':'switched off'),o.title,'tag',o.active?'ok':'warn');
        Router.refresh(); UI.toast('ok',o.active?'Offer is live':'Offer switched off','');
      }
      if(act==='dup'){
        const copy = Object.assign({},o,{id:U.id('o'),title:o.title+' (copy)',active:false,createdAt:Date.now()});
        Store.insert('offers',copy);
        Router.refresh(); UI.toast('ok','Offer duplicated','');
      }
      if(act==='del'){
        if(await UI.confirm({title:'Delete this offer?',message:'"'+o.title+'" will be removed from your website.',confirmText:'Delete offer'})){
          Store.remove('offers',o.id);
          Store.log('Offer deleted',o.title,'trash','dan');
          Router.refresh(); UI.toast('ok','Offer deleted','');
        }
      }
    });
  }
});

            ${H.field('Instagram profile',H.input('social.instagram',c.social.instagram,'https://instagram.com/...'))}
            ${H.field('TikTok profile',H.input('social.tiktok',c.social.tiktok,'https://tiktok.com/@...'))}

      </div>
      <div class="grid" style="gap:14px">
        ${H.card('Business hours','Switch a day off to show it as closed',`
          <div class="grid" style="gap:8px">

              <div class="sortrow" style="margin:0">
                <b style="font-size:12.5px;width:78px;flex-shrink:0">${h.day}</b>
                ${h.closed
                  ? `<span class="chip dan" style="flex:1;justify-content:center">Closed</span>`
                  : `<input class="inp" data-hi="${i}" data-hk="open" type="time" value="${h.open}" aria-label="${U.esc(h.day)} opening time" style="padding:6px 9px;font-size:12.5px;flex:1;min-width:0">
                     <span style="color:var(--text-3);font-size:12px">to</span>
                     <input class="inp" data-hi="${i}" data-hk="close" type="time" value="${h.close}" aria-label="${U.esc(h.day)} closing time" style="padding:6px 9px;font-size:12.5px;flex:1;min-width:0">`}
                <label class="switch ok" title="Open on this day"><input type="checkbox" data-hopen="${i}" ${h.closed?'':'checked'}><span class="track"></span></label>
              </div>`).join('')}
          </div>`)}

          <div class="kv">

      h.closed = !cb.checked;

});

   MODULE: Enquiries
   ================================================================== */
Portal.register({
  id:'enquiries', title:'Enquiries', sub:'Leads from your website', icon:'inbox', group:'Customers', instant:true,
  badge(st){ return st.unread ? {text:String(st.unread)} : null; },
  state:{ tab:'all', q:'' },
  render(){
    const s = this.state;
    const all = Store.list('enquiries');
    const counts = { all:all.length };
    BUSINESS.vocab.enquiryStatuses.forEach(k=>{ counts[k] = all.filter(e=>e.status===k).length; });
    let list = s.tab==='all' ? all.slice() : all.filter(e=>e.status===s.tab);
    if(s.q){
      const q = s.q.toLowerCase();
      list = list.filter(e=>[e.name,e.phone,e.email,e.make,e.model,e.registration,e.service,e.vehicle,e.message].join(' ').toLowerCase().indexOf(q)>=0);
    }
    list.sort((a,b)=>b.createdAt-a.createdAt);

    return `
    ${H.head('Enquiries','Every message from your website, WhatsApp and phone in one place.',`
      <button class="btn" data-act="export">${ICON.download} Export CSV</button>
      <button class="btn btn-pri" data-act="add">${ICON.plus} Log an enquiry</button>`)}

    <div class="stats" style="margin-bottom:18px">
      ${H.stat({label:'Unread',count:counts.unread,icon:'inbox',tone:counts.unread?'dan':'ok',sub:'<span>Need a reply</span>'})}
      ${H.stat({label:'In progress',count:counts.contacted+counts.quoted,icon:'phone',tone:'warn',sub:`<span>${counts.quoted} quoted</span>`})}
      ${H.stat({label:'Booked in',count:counts.booked,icon:'calendar',tone:'vio',sub:'<span>Work scheduled</span>'})}
      ${H.stat({label:'Total enquiries',count:counts.all,icon:'users',sub:'<span>All time</span>'})}
    </div>

    <div class="filters">
      <label class="search">${ICON.search}<input id="eq" placeholder="Search by name, number or vehicle" value="${U.esc(s.q)}"></label>
      <div class="segbar">
        ${[['all','All'],['unread','Unread'],['contacted','Contacted'],['quoted','Quoted'],['booked','Booked'],['completed','Completed']]
          .map(t=>`<button data-etab="${t[0]}" class="${s.tab===t[0]?'on':''}">${t[1]}<span class="n">${counts[t[0]]}</span></button>`).join('')}
      </div>
    </div>

    ${list.length ? `<div class="card"><div class="card-b flush"><div class="tbl-wrap">
      <table class="tbl">
        <thead><tr><th>Customer</th><th>Vehicle</th><th>Service</th><th>Contact</th><th>Received</th><th>Status</th><th style="text-align:right">Actions</th></tr></thead>
        <tbody>
          ${list.map(e=>`<tr class="${e.status==='unread'?'unread':''}" data-eopen="${e.id}" style="cursor:pointer">
            <td>
              <div style="display:flex;align-items:center;gap:10px">
                <div class="avatar" style="width:30px;height:30px;font-size:11px">${U.esc(U.initials(e.name))}</div>
                <div style="min-width:0"><b>${U.esc(e.name)}</b><div class="mut">${e.demo?'Sample record':U.esc(e.source||'Website')}</div></div>
              </div>
            </td>
            <td><span class="chip">${ICON.car} ${U.esc(e.vehicle||[e.make,e.model].filter(Boolean).join(' ')||'Not given')}</span>${e.registration?`<div class="mut">${U.esc(e.registration)}</div>`:''}</td>
            <td>${e.service?`<span class="chip acc">${U.esc(e.service)}</span>`:'<span class="mut">General enquiry</span>'}</td>
            <td><div>${U.esc(e.phone||'')}</div><div class="mut">${U.esc(e.email||'')}</div></td>
            <td><div>${U.ago(e.createdAt)}</div><div class="mut">${U.dateTime(e.createdAt)}</div></td>
            <td><span class="chip ${Modules.enquiryTone(e.status)}"><i></i>${e.status.charAt(0).toUpperCase()+e.status.slice(1)}</span></td>
            <td>
              <div class="row" style="justify-content:flex-end;gap:5px;flex-wrap:nowrap">
                <button class="btn btn-sm btn-icon" data-eact="view" data-id="${e.id}" title="Open">${ICON.eye}</button>
                <button class="btn btn-sm btn-icon" data-eact="wa" data-id="${e.id}" title="Reply on WhatsApp">${ICON.whatsapp}</button>
                <button class="btn btn-sm btn-icon" data-eact="mail" data-id="${e.id}" title="Reply by email">${ICON.mail}</button>
                <button class="btn btn-sm btn-icon btn-dan" data-eact="del" data-id="${e.id}" title="Delete">${ICON.trash}</button>
              </div>
            </td>
          </tr>`).join('')}
        </tbody>
      </table></div></div></div>`
    : H.empty('inbox', s.q?'No enquiries match your search':'No enquiries here yet',
        s.q?'Try a different name, number, vehicle or service.':'When a customer sends a message from your website it will appear in this list.')}`;
  },
  mount(root){
    const s = this.state;
    const q = U.el('#eq',root);
    if(q) q.addEventListener('input',U.debounce(()=>{ s.q=q.value; Router.refresh(); },260));
    U.on(root,'click','[data-etab]',(e,b)=>{ s.tab=b.dataset.etab; Router.refresh(); });
    U.on(root,'click','[data-act="export"]',()=>Modules.exportEnquiries());
    U.on(root,'click','[data-act="add"]',()=>Modules.enquiryForm());
    U.on(root,'click','[data-eopen]',(e,tr)=>{ if(!e.target.closest('[data-eact]')) Modules.enquiryView(tr.dataset.eopen); });
    U.on(root,'click','[data-eact]',async(e,b)=>{
      e.stopPropagation();
      const en = Store.find('enquiries',b.dataset.id);
      if(!en) return;
      const act = b.dataset.eact;
      if(act==='view') return Modules.enquiryView(en.id);
      if(act==='wa'){
        const n = (en.phone||'').replace(/[^0-9]/g,'').replace(/^0/,'27');
        if(!n) return UI.toast('warn','No phone number','This enquiry has no number saved.');
        window.open('https://wa.me/'+n+'?text='+encodeURIComponent(BUSINESS.templates.whatsappReply(en)),'_blank','noopener');
        if(en.status==='unread'){ Store.update('enquiries',en.id,{status:'contacted'}); Router.refresh(); }
      }
      if(act==='mail'){
        if(!en.email) return UI.toast('warn','No email address','This enquiry has no email saved.');
        window.location.href = 'mailto:'+en.email+'?subject='+encodeURIComponent(BUSINESS.templates.emailSubject(en))+'&body='+encodeURIComponent(BUSINESS.templates.emailReply(en));
        if(en.status==='unread'){ Store.update('enquiries',en.id,{status:'contacted'}); Router.refresh(); }
      }
      if(act==='del'){
        if(await UI.confirm({title:'Delete this enquiry?',message:'The message from '+en.name+' will be permanently removed.',confirmText:'Delete enquiry'})){
          Store.remove('enquiries',en.id);
          Store.log('Enquiry deleted','Message from '+en.name+' was removed','trash','dan');
          Router.refresh(); UI.toast('ok','Enquiry deleted','');
        }
      }
    });
  }
});

      </div>
      <div class="grid" style="gap:14px">
        ${H.card('Logo','Shown in your header and footer','<div id="logoUp"></div>')}

      </div>

      Store.persist(); Store.log('Appearance updated','Website colours or fonts were changed','palette'); repaint();

      a.radius=Number(el.value);
      const hint = el.closest('.field').querySelector('.hint');
      if(hint) hint.textContent = 'Currently '+a.radius+'px';
      this.preview(root);
    }));
    U.on(root,'click','[data-acc]',(e,b)=>{
      a.accent = b.dataset.acc; Store.persist();
      Store.log('Accent colour changed','Website accent set to '+a.accent,'palette');
      Router.refresh(); UI.toast('ok','Accent colour updated','');
    });
    U.on(root,'click','[data-act="reset"]',async()=>{
      if(await UI.confirm({title:'Reset appearance?',message:'Colours, fonts and button styles return to the '+BUSINESS.name+' defaults. Your logo and images are kept.',confirmText:'Reset appearance',tone:'warn'})){

        Store.persist(); Shell.applyTheme(); Router.refresh(); UI.toast('ok','Appearance reset','');

Portal.register({
  id:'analytics', title:'Analytics', sub:'How your website is performing', icon:'chart', group:'Insights',
  render(){
    const a = Store.data.analytics;
    const st = Store.stats();
    /* No traffic entered yet means no trend to show - null, never NaN. */
    const growth = Number(a.visitorsPrev)>0
      ? Math.round(((a.visitors30Total-a.visitorsPrev)/a.visitorsPrev)*100) : null;
    const maxV = Math.max.apply(null,a.visitors7.concat([1]));
    const days = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
    const topVeh = Store.list('builds').filter(v=>!v.archived).sort((x,y)=>(y.views||0)-(x.views||0)).slice(0,6);
    const spark = (vals)=>{
      const max = Math.max.apply(null,vals), min = Math.min.apply(null,vals);
      const pts = vals.map((v,i)=>{
        const x = (i/(vals.length-1))*100;
        const y = 46 - ((v-min)/(max-min||1))*38;
        return x.toFixed(1)+','+y.toFixed(1);
      }).join(' ');
      return `<svg class="spark" viewBox="0 0 100 52" preserveAspectRatio="none">
        <defs><linearGradient id="sg" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="var(--accent)" stop-opacity=".38"/><stop offset="100%" stop-color="var(--accent)" stop-opacity="0"/>
        </linearGradient></defs>
        <polygon points="0,52 ${pts} 100,52" fill="url(#sg)"/>
        <polyline points="${pts}" fill="none" stroke="var(--accent-2)" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
      </svg>`;
    };
    return `
    ${H.head('Analytics','A snapshot of your website traffic and the leads it produces. These figures are sample data for design purposes.',
      `<span class="chip warn">${ICON.info} Sample data</span>`)}
    <div class="stats" style="margin-bottom:16px">
      ${H.stat({label:'Visitors this month',count:a.visitors30Total,icon:'users',sub:growth===null?'<span>No previous month to compare</span>':`<span class="trend ${growth>=0?'up':'down'}">${growth>=0?'+':''}${growth}%</span><span>vs last month</span>`})}
      ${H.stat({label:'Build views',count:a.buildViews,icon:'eye',tone:'vio',sub:'<span>Across all published builds</span>'})}
      ${H.stat({label:'WhatsApp clicks',count:a.whatsappClicks,icon:'whatsapp',tone:'ok',sub:'<span class="trend up">Your best lead source</span>'})}
      ${H.stat({label:'Phone calls',count:a.phoneCalls,icon:'phone',tone:'warn',sub:'<span>Tap to call on mobile</span>'})}
      ${H.stat({label:'Form enquiries',count:a.formSubmits,icon:'inbox',sub:'<span>Sent from your contact page</span>'})}
      ${H.stat({label:'Conversion rate',value:Number(a.visitors30Total)>0?((a.whatsappClicks+a.phoneCalls+a.formSubmits)/a.visitors30Total*100).toFixed(1)+'%':'No data',icon:'trend',tone:Number(a.visitors30Total)>0?'ok':'',sub:Number(a.visitors30Total)>0?'<span>Visitors who made contact</span>':'<span>Enter your visitor numbers first</span>'})}
    </div>

    <div class="grid" style="grid-template-columns:1.5fr 1fr;align-items:start;margin-bottom:16px" data-an-cols>
      ${H.card('Visitors this week','Daily unique visitors',`
        <div class="bars">
          ${a.visitors7.map((v,i)=>`<div class="bar-col"><b>${U.num(v)}</b><div class="bar" style="height:${Math.round((v/maxV)*112)}px"></div><span>${days[i]}</span></div>`).join('')}
        </div>
        <div class="sep"></div>
        ${spark(a.visitors7)}`)}
      ${H.card('Where visitors come from','Traffic sources',`
        <div class="rank">
          ${Object.keys(a.sources).map((k,i)=>`
            <div class="rank-row">
              <div class="rank-top"><span class="rank-n">${i+1}</span><b>${U.esc(k)}</b><span>${a.sources[k]}%</span></div>
              <div class="meter ${i%3===1?'ok':i%3===2?'vio':''}"><i data-w="${a.sources[k]}%"></i></div>
            </div>`).join('')}
        </div>`)}
    </div>

    <div class="grid" style="grid-template-columns:1fr 1fr;align-items:start;margin-bottom:16px" data-an-cols>
      ${H.card('Most viewed builds','Your most popular builds',
        topVeh.length?`<div class="rank">${topVeh.map((v,i)=>`
          <div class="rank-row">
            <div class="rank-top"><span class="rank-n">${i+1}</span><b>${U.esc(v.name)}</b><span>${U.num(v.views||0)}</span></div>
            <div class="meter"><i data-w="${Math.round(((v.views||0)/(topVeh[0].views||1))*100)}%"></i></div>
          </div>`).join('')}</div>`:H.empty('stage','No builds yet','Add builds to see view counts.'))}
      ${H.card('Devices used','How people browse your website',`
        <div class="rank">
          ${Object.keys(a.devices).map((k,i)=>`
            <div class="rank-row">
              <div class="rank-top"><span class="rank-n">${ICON.globe?i+1:''}</span><b>${U.esc(k)}</b><span>${a.devices[k]}%</span></div>
              <div class="meter ${i===0?'ok':i===1?'':'warn'}"><i data-w="${a.devices[k]}%"></i></div>
            </div>`).join('')}
        </div>
        <div class="note" style="margin-top:16px">${ICON.info}<div>Most of your visitors are on a phone, so your mobile layout matters most.</div></div>`)}
    </div>

    ${H.card('Enquiries by status','Where your leads currently sit',`
      <div class="grid g3">
        ${[['Unread',st.unread,'dan'],['Contacted',Store.list('enquiries').filter(e=>e.status==='contacted').length,'warn'],['Quoted',Store.list('enquiries').filter(e=>e.status==='quoted').length,'warn'],['Booked',Store.list('enquiries').filter(e=>e.status==='booked').length,'vio'],['Completed',Store.list('enquiries').filter(e=>e.status==='completed').length,'ok']]
          .map(r=>`<div class="stat" style="animation:none">
            <div class="stat-lab">${r[0]}</div>
            <div class="stat-val" data-count="${r[1]}"></div>
            <div class="meter ${r[2]==='ok'?'ok':r[2]==='warn'?'warn':''}" style="margin-top:10px"><i data-w="${st.enquiries?Math.round((r[1]/st.enquiries)*100):0}%"></i></div>
          </div>`).join('')}
      </div>`)}`;
  },
  mount(root){
    const fix = ()=>U.els('[data-an-cols]',root).forEach((g,i)=>{
      g.style.gridTemplateColumns = window.innerWidth<960 ? 'minmax(0,1fr)' : (i===0?'1.5fr 1fr':'1fr 1fr');
    });
    fix(); window.addEventListener('resize',U.debounce(fix,200));
  }
});

Portal.register({

            <button class="btn btn-block" data-act="csvenq">${ICON.file} Export enquiries as CSV</button>

              <div class="kv-row"><span>Authentication</span><b>Supabase Auth</b></div>
              <div class="kv-row"><span>Session</span><b>Survives a refresh</b></div>

            ${H.field('Change your password',`<input class="inp" type="password" id="pwNew" placeholder="New password, at least 8 characters" autocomplete="new-password">`,'Updates the password on your Supabase account straight away.')}
            ${H.field('Confirm new password',`<input class="inp" type="password" id="pwNew2" placeholder="Type it again" autocomplete="new-password">`)}

            <button class="btn btn-block" id="btnSignOut2">${ICON.shield} Sign out of the portal</button>
            <div class="note">${ICON.info}<div>There is no local portal password any more. Access is controlled entirely by your Supabase account and the owner allowlist, so losing this file does not expose your data.</div></div>

        ${H.card('Danger zone','Actions here cannot be undone',`
          <div class="grid" style="gap:10px">
            <button class="btn btn-dan btn-block" data-act="clearenq">${ICON.inbox} Delete all enquiries</button>
            <button class="btn btn-dan btn-block" data-act="clearveh">${ICON.car} Delete all vehicles</button>
            <button class="btn btn-dan btn-block" data-act="reset">${ICON.warn} Reset entire portal</button>
            <div class="note dan">${ICON.warn}<div>Resetting returns the portal to its starting content. Download a backup first if you might want your data back.</div></div>
          </div>`)}

        ${H.card('Connecting a database','How to go live with real data later',`
          <div class="grid" style="gap:12px">
            <div class="note">${ICON.db}<div>Your portal currently saves to this browser. Every action already runs through a single storage layer, so moving to Supabase or Firebase only means swapping four functions.</div></div>
            <div class="code">DB.read()    // load all portal data
DB.write(d)  // save all portal data

          </div>`)}

        ${H.card('Coming soon','Modules ready to be added to your portal',`
          <div class="grid" style="gap:8px">
            ${[['Finance Applications','Capture and track finance deals','briefcase'],
               ['Staff Management','Team members and permissions','users'],
               ['Inventory Reports','Stock age and turnover reports','chart'],
               ['Service History','Vehicle service records','gear2'],
               ['Customer CRM','Full customer relationship history','users'],
               ['Invoice Generator','Create and send invoices','doc'],
               ['Quotation Builder','Build quotes in seconds','file'],
               ['Notification Centre','Alerts for new leads','bell'],
               ['AI Description Writer','Write vehicle adverts automatically','sparkles'],
               ['Vehicle Comparison','Let buyers compare two cars','layers'],
               ['Document Uploads','Store licences and NATIS papers','file']]
              .map(s=>`<div class="soon"><div class="li-ic vio">${ICON[s[2]]}</div><div style="min-width:0"><b>${s[0]}</b><small>${s[1]}</small></div><span class="chip vio" style="margin-left:auto">Planned</span></div>`).join('')}
          </div>`)}
      </div>
    </div>`;
  },
  mount(root){
    const m = Store.data.meta;
    U.on(root,'change','[data-k="siteLive"]',(e,cb)=>{
      m.siteLive = cb.checked; Store.persist();
      Store.log(cb.checked?'Website switched on':'Website switched off',cb.checked?'Visitors can browse normally':'Visitors see a maintenance notice','globe',cb.checked?'ok':'warn');
      Router.refresh(); UI.toast(cb.checked?'ok':'warn',cb.checked?'Website is live':'Website is offline','');
    });
    U.on(root,'click','[data-act="export"]',()=>Modules.exportAll());
    U.on(root,'click','[data-act="import"]',()=>U.el('#impFile',root).click());
    U.el('#impFile',root).addEventListener('change',e=>Modules.importAll(e.target.files[0]));
    U.on(root,'click','[data-act="csvveh"]',()=>Modules.exportBuilds());
    U.on(root,'click','[data-act="csvenq"]',()=>Modules.exportEnquiries());
    U.on(root,'click','[data-act="csvtst"]',()=>Modules.exportTestimonials());

    U.el('#pwSave',root).addEventListener('click',async()=>{
      const err = U.el('#pwErr',root);
      const btn = U.el('#pwSave',root);
      const n = U.el('#pwNew',root).value, n2 = U.el('#pwNew2',root).value;
      if(n.length < 8) return err.textContent = 'Your new password must be at least 8 characters.';
      if(n !== n2) return err.textContent = 'The two new passwords do not match.';
      err.textContent = ''; btn.disabled = true;
      try{
        await Cloud.updatePassword(n);
        U.el('#pwNew',root).value=''; U.el('#pwNew2',root).value='';
        Store.log('Password changed','Your Supabase account password was updated','key','warn');
        Store.persist(true);
        UI.toast('ok','Password updated','Use it next time you sign in');
      }catch(ex){ err.textContent = ex.message; }
      finally{ btn.disabled = false; }
    });
    U.el('#btnSignOut2',root).addEventListener('click',()=>U.el('#btnLogout').click());

    U.on(root,'click','[data-act="clearenq"]',async()=>{
      if(await UI.confirm({title:'Delete all enquiries?',message:'Every customer message will be permanently removed. Export a CSV first if you need the records.',confirmText:'Delete all enquiries'})){
        Store.replaceAll('enquiries',[]);
        Store.log('All enquiries deleted','The enquiry list was cleared','trash','dan');
        Router.refresh(); UI.toast('ok','Enquiries deleted','');
      }
    });
    U.on(root,'click','[data-act="clearveh"]',async()=>{
      if(await UI.confirm({title:'Delete all vehicles?',message:'Every vehicle and its photos will be removed from your website.',confirmText:'Delete all vehicles'})){
        Store.replaceAll('builds',[]);
        Store.log('All vehicles deleted','The stock list was cleared','trash','dan');
        Router.refresh(); UI.toast('ok','Vehicles deleted','');
      }
    });
    U.on(root,'click','[data-act="reset"]',async()=>{
      if(await UI.confirm({title:'Reset the entire portal?',message:'All of your content, settings and images will be replaced with the starting sample data. This cannot be undone.',confirmText:'Reset everything'})){
        DB.clear(); Store.init(); Shell.applyTheme(); Router.buildNav(); Router.go('dashboard');
        UI.toast('ok','Portal reset','Everything is back to the starting content');
      }
    });
  }
});

create or replace function public.touch_updated_at()
returns trigger
language plpgsql
as $$
begin
  new.updated_at = now();
  return new;
end;
$$;

do $$
declare t text;
begin
  foreach t in array array['site_settings','builds','services','stages','products','brands','faqs','testimonials','offers','enquiries']
  loop
    execute format('drop trigger if exists touch_%1$s on public.%1$s', t);
    execute format(
      'create trigger touch_%1$s before update on public.%1$s
       for each row execute function public.touch_updated_at()', t);
  end loop;
end $$;

/* ==================================================================
   MODULES  -  shared actions, forms and dialogs used across pages
   ================================================================== */
const Modules = {

  /* Chip tone per enquiry status, so the table, detail view and any
     future surface stay in step. */
  enquiryTone(status){
    return status==='unread' ? 'acc'
      : status==='contacted' ? 'warn'
      : status==='quoted' ? 'warn'
      : status==='booked' ? 'vio'
      : 'ok';
  },

  /* ---------- performance builds ---------------------------------- */
  filterBuilds(all,s){
    let list = all.slice();
    if(s.tab==='archived') list = list.filter(b=>b.archived);
    else{
      list = list.filter(b=>!b.archived);
      if(s.tab==='published') list = list.filter(b=>b.published);
      if(s.tab==='drafts')    list = list.filter(b=>!b.published);
      if(s.tab==='featured')  list = list.filter(b=>b.featured);
    }
    if(s.make) list = list.filter(b=>b.make===s.make);
    if(s.q){
      const q = s.q.toLowerCase();
      list = list.filter(b=>[b.title,b.make,b.model,b.stage,b.engine,b.tuningType,String(b.year)].join(' ').toLowerCase().indexOf(q)>=0);
    }
    const gain = b=>(Number(b.powerAfter)||0)-(Number(b.powerBefore)||0);
    const stageIx = b=>{ const i = BUSINESS.vocab.stages.indexOf(b.stage); return i<0?99:i; };
    const by = {
      'newest':(a,b)=>(b.completedAt||b.createdAt)-(a.completedAt||a.createdAt),
      'oldest':(a,b)=>(a.completedAt||a.createdAt)-(b.completedAt||b.createdAt),
      'gain-hi':(a,b)=>gain(b)-gain(a),
      'power-hi':(a,b)=>(Number(b.powerAfter)||0)-(Number(a.powerAfter)||0),
      'stage':(a,b)=>stageIx(a)-stageIx(b),
      'views':(a,b)=>(b.views||0)-(a.views||0),
      'name':(a,b)=>String(a.title).localeCompare(String(b.title))
    };
    return list.sort(by[s.sort]||by.newest);
  },

  async buildAction(act,id){
    const b = Store.find('builds',id);
    if(!b) return;
    if(act==='edit') return Modules.buildForm(id);
    if(act==='menu') return Modules.buildMenu(b);

    if(act==='publish'){
      const now = !b.published;
      Store.update('builds',id,{published:now,status:now?'published':'draft',featured:now?b.featured:false});
      Store.log(now?'Build published':'Build unpublished',b.title,'checkCircle',now?'ok':'acc');
      Store.persist(true); Router.refresh();
      UI.toast('ok',now?'Published to your website':'Removed from your website',b.title);
    }
    if(act==='feature'){
      Store.update('builds',id,{featured:!b.featured});
      Store.log(!b.featured?'Build featured':'Build unfeatured',b.title,'star');
      Router.refresh(); UI.toast('ok',!b.featured?'Added to featured':'Removed from featured',b.title);
    }
    if(act==='dup'){
      const copy = Object.assign({},b,{
        id:U.id('b'), title:b.title+' (copy)', published:false, featured:false, archived:false,
        status:'draft', views:0, createdAt:Date.now(),
        images:(b.images||[]).slice(), workDone:(b.workDone||[]).slice()
      });
      Store.insert('builds',copy);
      Store.log('Build duplicated',copy.title,'copy');
      Router.refresh(); UI.toast('ok','Build duplicated','Edit the copy and update its details');
    }
    if(act==='archive'){
      Store.update('builds',id,{archived:true,featured:false,published:false});
      Store.log('Build archived',b.title+' was hidden from the website','archive','warn');
      Router.refresh(); UI.toast('ok','Build archived','It is hidden from your website but not deleted');
    }
    if(act==='unarchive'){
      Store.update('builds',id,{archived:false});
      Store.log('Build restored',b.title+' is back in your list','refresh','ok');
      Router.refresh(); UI.toast('ok','Build restored','');
    }
    if(act==='del'){
      if(await UI.confirm({title:'Delete this build?',message:b.title+' and all of its photos will be permanently removed. Archive it instead if you only want to hide it.',confirmText:'Delete build'})){
        Store.remove('builds',id);
        Store.log('Build deleted',b.title,'trash','dan');
        Router.refresh(); UI.toast('ok','Build deleted','');
      }
    }
  },

  buildForm(id){
    const editing = !!id;
    const v = editing ? Object.assign({},Store.find('builds',id)) : {
      title:'', make:'', model:'', year:new Date().getFullYear(), engine:'', fuel:'Petrol',
      transmission:'Manual', stage:'Stage 1', tuningType:'ECU remap', validation:'Dyno',
      powerBefore:0, powerAfter:0, torqueBefore:0, torqueAfter:0, workDone:[], description:'',
      customerRef:'', images:[], status:'draft', featured:false, published:false, archived:false,
      views:0, completedAt:Date.now()
    };
    if(!v.workDone) v.workDone = [];
    if(!v.images) v.images = [];
    const draft = Object.assign({},v);
    let tab = 'details';

    const body = `
      <div class="tabs" data-btabs>
        <button data-bt="details" class="on">Vehicle</button>
        <button data-bt="tune">Tune &amp; results</button>

      </div>
