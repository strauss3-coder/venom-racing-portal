          <span>${U.esc(m.title)}</span>
          <span data-badge="${m.id}"></span>
        </button>`).join('')}
    `).join('');
    U.on(U.el('#sbNav'),'click','[data-nav]',(e,b)=>{
      location.hash = '#/'+b.dataset.nav;
      Shell.closeSidebar();
    });
    this.paintBadges();
  },

  paintBadges(){
    const st = Store.stats();
    Portal.modules.forEach(m=>{
      const slot = U.el(`[data-badge="${m.id}"]`);
      if(!slot) return;
      const b = m.badge ? m.badge(st) : null;
      slot.outerHTML = b
        ? `<span class="sb-badge ${b.mut?'mut':''}" data-badge="${m.id}">${U.esc(b.text)}</span>`
        : `<span data-badge="${m.id}"></span>`;
    });
    const bell = U.el('#bellDot');
    if(bell) bell.style.display = st.unread ? 'block' : 'none';
  },

  /* Cleanups registered by the page currently mounted. Without this a
     module that attaches a window listener in mount() accumulates one
     copy per visit, and every one keeps firing. */
  _cleanups:[],
  _nav:0,
  onTeardown(fn){ if(typeof fn==='function') Router._cleanups.push(fn); },
  teardown(){
    const fns = Router._cleanups;
    Router._cleanups = [];
    fns.forEach(fn=>{ try{ fn(); }catch(e){} });
  },

  go(id,params){
    const mod = Portal.byId[id] || Portal.modules[0];
    UI.closeAll();
    Router.teardown();
    this.current = mod.id;
    U.els('.sb-link').forEach(b=>b.classList.toggle('on',b.dataset.nav===mod.id));
    U.el('#tbTitle').innerHTML = `${U.esc(mod.title)}<small>${U.esc(mod.sub||'')}</small>`;

    /* Replace the view element rather than just its innerHTML.

       Every module's mount() registers delegated listeners with
       U.on(root, ...), which calls root.addEventListener with no way to
       detach. `root` is this element, and it used to survive every
       navigation - so a module visited six times had six copies of each
       handler, and one click on Add opened six stacked dialogs. Closing
       one left five, which is what "the X needs several clicks" was.

       Swapping in a clone drops every listener atomically, whatever a
       module attached, so this cannot regress as modules are added. */
    const stale = U.el('#view');
    const view = stale.cloneNode(false);
    stale.replaceWith(view);

    view.classList.remove('anim');
    view.innerHTML = UI.skeleton(mod.skeleton||'list',5);
    document.title = mod.title+' · '+BUSINESS.name+' '+BUSINESS.portalLabel;

    /* A superseded navigation must not paint over a newer one. Two quick
       clicks used to run both timeouts, mounting two modules onto the
       same node. */
    const token = ++Router._nav;
    setTimeout(()=>{
      if(token !== Router._nav || !view.isConnected) return;
      view.innerHTML = mod.render(params||{});
      void view.offsetWidth;
      view.classList.add('anim');
      if(mod.mount) mod.mount(view,params||{});
      UI.animateAll(view);
      Router.paintBadges();
      window.scrollTo({top:0,behavior:'instant'});
    }, mod.instant?0:150);
  },

  refresh(){ if(this.current) this.go(this.current); },

  start(){
    const read = ()=>{
      const h = (location.hash||'').replace(/^#\/?/,'');
      const [id,q] = h.split('?');
      const params = {};
      (q||'').split('&').filter(Boolean).forEach(p=>{
        const [k,v]=p.split('='); params[decodeURIComponent(k)]=decodeURIComponent(v||'');
      });
      this.go(id||'dashboard',params);
    };
    window.addEventListener('hashchange',read);
    read();
  }
};

const Shell = {
  /* The static shell markup carries no client name. This writes it in
     from BUSINESS so the config stays the single source of truth. */
  applyBrand(){
    const set = (sel,txt)=>{ const el=U.el(sel); if(el) el.textContent = txt; };
    set('#bootName',BUSINESS.name);
    set('#bootMark',BUSINESS.initial);
    set('#loginMark',BUSINESS.initial);
    set('#sbMark',BUSINESS.initial);
    set('#loginSub','Sign in with your Supabase account to manage the '+BUSINESS.name+' website.');
    const em = U.el('#loginEmail');
    if(em) em.placeholder = 'you@'+DOMAIN;
    const t = U.el('#sbTitle');
    if(t) t.innerHTML = U.esc(BUSINESS.name)+'<span>'+U.esc(BUSINESS.portalLabel)+'</span>';
    document.title = BUSINESS.name+' '+BUSINESS.portalLabel;
  },

  /* Publish on first connect, then keep quiet. Never blocks the UI. */
  async afterAuth(){
    const r = await Cloud.ensureSeeded();
    if(r && r.seeded){
      const n = Object.values(r.counts||{}).reduce((a,b)=>a+b,0);
      UI.toast('ok','Website content published',n+' records are now live in your database');
      Router.refresh();
    }else if(r && r.skipped==='not-owner'){
      UI.toast('warn','Not on the owner allowlist','Run add-me-as-owner.sql, then sign in again');
    }
    Shell.paintStatus();
    return r;
  },

  openSidebar(){ U.el('#sidebar').classList.add('on'); U.el('#scrim').classList.add('on'); },
  closeSidebar(){ U.el('#sidebar').classList.remove('on'); U.el('#scrim').classList.remove('on'); },
  applyTheme(){
    const a = Store.data.appearance;
    document.documentElement.style.setProperty('--accent',a.accent||BUSINESS.brand.accent);
    document.documentElement.style.setProperty('--accent-glow',(a.accent||BUSINESS.brand.accent)+'6B');
    document.documentElement.style.setProperty('--accent-soft',(a.accent||BUSINESS.brand.accent)+'24');
    document.documentElement.style.setProperty('--success',a.success||BUSINESS.brand.success);
  },
  login(){
    if(!Cloud.authed) return Shell.lock();      /* never open the portal unauthenticated */
    U.el('#login').classList.add('hide');
    U.el('#app').classList.add('on');
    Router.buildNav();
    Router.start();
    Shell.paintStatus();
    U.el('.sb-user b').textContent = Cloud.email.split('@')[0] || 'Owner';
    U.el('.sb-user small').textContent = Cloud.email || 'Signed in';
    /* send anything queued, then load the latest content from the database */
    if(Cloud.authed){
      Cloud.flush()
        .then(()=>Cloud.pullAll())
        .then(res=>{
          if(res && res.blocked){
            Modules.ownerHelp();
            return;
          }
          if(res && res.empty){
            UI.toast('warn','Your database is empty','Open Database and push your content to fill it');
            return;
          }
          Shell.applyTheme(); Router.refresh();
          UI.toast('ok','Loaded from database','Your content is up to date');
        })
        .catch(err=>{
          Cloud.setStatus('offline',err.message);
          UI.toast('warn','Working offline','Showing the last copy saved on this device');
        });
    }
  },
  async logout(){
    const btn = U.el('#btnLogout');
    if(btn) btn.innerHTML = ICON.refresh;
    await Cloud.signOut();                       /* revokes the token server side */
    Shell.lock();
  },

  /* Shows the login screen and closes the portal behind it. */
  lock(message){
    U.el('#app').classList.remove('on');
    U.el('#login').classList.remove('hide');
    const p = U.el('#loginPass'); if(p) p.value='';
    U.el('#loginErr').textContent = message || '';
    Shell.paintLogin();
  },

  paintLogin(){
    const em = (Cloud.session && Cloud.session.email) || Shell.lastEmail || '';
    if(em) U.el('#loginEmail').value = em;

    /* Two states on one screen: connect the project, then sign in. */
    const ready = Cloud.on;
    U.el('#setupForm').classList.toggle('hide',ready);
    U.el('#loginForm').classList.toggle('hide',!ready);
    U.el('#loginForgot').classList.toggle('hide',!ready);
    U.el('#loginSub').textContent = ready
      ? 'Sign in with your Supabase account to manage the '+BUSINESS.name+' website.'
      : 'First, connect this portal to your Supabase project. You only do this once on this device.';
    U.el('#loginHint').innerHTML = ready
      ? 'Secured by Supabase Authentication.'
      : 'Project Settings, API in your Supabase dashboard.';
    if(ready && Cloud.cfg) U.el('#setupUrl').value = Cloud.cfg.url;
  },

  paintStatus(){
    const pill = U.el('#syncPill');
    if(!pill) return;
    const s = Cloud.status;
    const cls = s==='online'?'':s==='syncing'?'acc':s==='offline'?'warn':'dan';
    const txt = s==='online'?'Synced':s==='syncing'?'Syncing':s==='offline'?'Offline':'Sign in needed';
    const title = Cloud.statusLabel()+(Cloud.queue.length?' ('+Cloud.queue.length+' waiting)':'')+(Cloud.lastError?'. '+Cloud.lastError:'');
    pill.className = 'live '+cls;
    pill.title = title;
    U.el('span',pill).textContent = txt;
  },
  init(){
    Shell.applyTheme();
    U.el('#burger').addEventListener('click',Shell.openSidebar);
    U.el('#scrim').addEventListener('click',Shell.closeSidebar);
    U.el('#btnLogout').addEventListener('click',async()=>{
      const pending = Cloud.queue.length;
      const msg = pending
        ? pending+' change'+(pending===1?'':'s')+' have not reached the database yet. Signing out now keeps them queued on this device until you sign back in.'
        : 'Everything is saved to your database. You will need your email and password to sign back in.';
      if(await UI.confirm({title:'Sign out?',message:msg,confirmText:'Sign out',tone:'warn'})) Shell.logout();
    });
    U.el('#btnPreview').addEventListener('click',()=>window.open(BUSINESS.website,'_blank','noopener'));
    U.el('#btnBell').addEventListener('click',()=>Modules.notifications());

    /* The only way into the portal: Supabase Authentication. This posts to
       /auth/v1/token?grant_type=password, which is exactly what the SDK's
       signInWithPassword() calls. No SDK, so the portal stays one file. */
    U.el('#setupForm').addEventListener('submit',async e=>{
      e.preventDefault();
      const err = U.el('#setupErr');
      const btn = U.el('#setupBtn');
      const url = Cloud.normaliseUrl(U.el('#setupUrl').value);
      const key = U.el('#setupKey').value.trim();

      if(!/^https:\/\/.+\..+/.test(url)) return err.textContent = 'That does not look like a project URL. It should read https://yourproject.supabase.co';
      if(!key) return err.textContent = 'Paste the publishable key from Project Settings, API.';

      btn.disabled = true; btn.textContent = 'Checking...'; err.textContent = '';
      const prev = Cloud.cfg;
      try{
        Cloud.setCfg(url,key);
        /* Auth health is the cheapest call that proves both the URL and
           the key. It needs no account, so it isolates a bad connection
           from a bad password. */
        const res = await fetch(url+'/auth/v1/health',{headers:{apikey:key}});
        if(res.status===401) throw new Error('That key was rejected. Copy the publishable key again from Project Settings, API.');
        if(!res.ok) throw new Error('The project answered with status '+res.status+'. Check the URL is your project address.');
        Shell.paintLogin();
        U.el('#loginEmail').focus();
        UI.toast('ok','Project connected','Now sign in with your Supabase account');
      }catch(ex){
        if(prev) Cloud.setCfg(prev.url,prev.key); else Cloud.cfg = null;
        err.textContent = /Failed|NetworkError|Load failed/i.test(ex.message)
          ? 'Could not reach that address. Check the project URL for typos.'
          : ex.message;
      }finally{
        btn.disabled = false; btn.textContent = 'Connect project';
      }
    });

    U.el('#loginForm').addEventListener('submit',async e=>{
      e.preventDefault();
      const err = U.el('#loginErr');
      const btn = U.el('#loginBtn');
      const email = U.el('#loginEmail').value.trim();
      const pass = U.el('#loginPass').value;

      if(!email) return err.textContent = 'Enter your email address.';
      if(!pass) return err.textContent = 'Enter your password.';

      btn.disabled = true; btn.textContent = 'Signing in...'; err.textContent = '';
      try{
        await Cloud.signIn(email,pass);
        Shell.lastEmail = email;
        Shell.login();
        setTimeout(()=>UI.toast('ok','Signed in',email),500);
        Shell.afterAuth();
      }catch(ex){
        err.textContent =
          /invalid|credential|grant/i.test(ex.message) ? 'That email and password do not match an account. Check for typos, or reset your password below.'
          : /confirm/i.test(ex.message) ? 'That account has not been confirmed yet. In Supabase, open Authentication, Users, and confirm it.'
          : /not connected to a Supabase project/i.test(ex.message) ? ex.message
          : /connection|internet/i.test(ex.message) ? 'Cannot reach the database. Check your internet and try again.'
          : ex.message;
        U.el('#loginPass').select();
      }finally{
        btn.disabled = false; btn.textContent = 'Sign in';
      }
    });

    U.el('#loginForgot').addEventListener('click',async()=>{
      const email = U.el('#loginEmail').value.trim();
      const err = U.el('#loginErr');
      if(!email) return err.textContent = 'Enter your email address first, then tap Forgot your password.';
      try{
        await Cloud.sendReset(email);
        err.textContent = '';
        UI.toast('ok','Reset email sent','Check '+email+' for a link to set a new password');
      }catch(ex){ err.textContent = ex.message; }
    });

    U.el('#syncPill').addEventListener('click',()=>{
      if(!Cloud.on) return location.hash = '#/database';
      if(Cloud.queue.length){ Cloud.flush(); UI.toast('info','Syncing now',Cloud.queue.length+' changes waiting'); }
      else location.hash = '#/database';
    });
    Shell.paintLogin();

    const gs = U.el('#globalSearch');
    document.addEventListener('keydown',e=>{
      if(e.key==='/' && document.activeElement.tagName!=='INPUT' && document.activeElement.tagName!=='TEXTAREA'){
        e.preventDefault(); gs.focus();
      }
    });
    gs.addEventListener('keydown',e=>{
      if(e.key==='Enter' && gs.value.trim()){
        location.hash = '#/services?q='+encodeURIComponent(gs.value.trim());
        gs.blur();
      }
    });

    Store.on('*',()=>Router.paintBadges());
  }
};

/* ==================================================================
   BOOT
   ================================================================== */
/* One Escape listener for the whole app. Previously each modal added its
   own, so Escape with a confirm open closed the confirm and the form
   underneath it in the same keystroke. */
document.addEventListener('keydown',e=>{
  if(e.key!=='Escape' || !UI._stack.length) return;
  e.stopPropagation();
  UI._stack[UI._stack.length-1].close();
});

Shell.applyBrand();  /* names the shell from BUSINESS before anything paints */
Cloud.init();        /* must run before the store, which mirrors writes to it */
Store.init();
Shell.init();

(function boot(){
  const bar = U.el('#bootBar');
  let p = 0;
  const t = setInterval(()=>{
    p = Math.min(100, p + 14 + Math.random()*20);
    bar.style.width = p+'%';
    if(p>=100){
      clearInterval(t);
      setTimeout(()=>{
        U.el('#boot').classList.add('done');
        /* A stored Supabase session reopens the portal straight away and
           survives a refresh. No session means the login screen, always. */
        if(Cloud.authed){
          Shell.login();
          /* renew the token if this session has been sitting for a while */
          if(Date.now() - (Cloud.session.at||0) > 40*60*1000) Cloud.refresh();
          /* Covers the returning owner who never signs in again. */
          Shell.afterAuth();
        }else{
          Shell.paintLogin();
          U.el('#login').classList.remove('hide');
        }
      },260);
    }
  },130);
})();

/* expose for console debugging and future integrations */
window.VenomPortal = { BUSINESS, Store, Portal, Router, Shell, UI, U, DB, Cloud, Assets, Modules, MAP, SCHEMA_SQL };

})();
