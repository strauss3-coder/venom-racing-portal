      size:'lg',
      title: editing ? 'Edit build' : 'Add a new build',
      sub: editing ? 'Changes appear on your website as soon as you save.' : 'Fill in what you know. You can always come back and add the dyno figures later.',
      body,
      footer:`<button class="btn" data-close>Cancel</button>
              <div class="sp">
                ${editing?`<button class="btn btn-dan" data-bdel>${ICON.trash} Delete</button>`:''}
                <button class="btn btn-pri" data-bsave>${ICON.check} ${editing?'Save changes':'Add build'}</button>
              </div>`
    });

    const panel = U.el('[data-bpanel]',m.el);

    function paint(){
      if(tab==='details'){
        panel.innerHTML = `
          <div class="grid g2">
            ${H.field('Build title',H.input('title',draft.title,'BMW M4 Stage 2'),'This is the heading shown on your website.')}
            ${H.field('Job reference',H.input('customerRef',draft.customerRef,'Optional'),'Not shown publicly. For your records only.','optional')}
            ${H.field('Make',H.sel('make',draft.make,[{v:'',l:'Choose a make'}].concat(BUSINESS.vocab.makes)))}
            ${H.field('Model',H.input('model',draft.model,'M4 Competition'))}
            ${H.field('Year',`<input class="inp" data-k="year" type="number" min="1970" max="${new Date().getFullYear()+1}" value="${draft.year}">`)}
            ${H.field('Engine',H.input('engine',draft.engine,'3.0L S55 Twin Turbo'))}
            ${H.field('Fuel',H.sel('fuel',draft.fuel,BUSINESS.vocab.fuels))}
            ${H.field('Transmission',H.sel('transmission',draft.transmission,BUSINESS.vocab.trans))}
          </div>`;
      }
      if(tab==='tune'){
        const gainKw = (Number(draft.powerAfter)||0)-(Number(draft.powerBefore)||0);
        const gainNm = (Number(draft.torqueAfter)||0)-(Number(draft.torqueBefore)||0);
        const pct = Number(draft.powerBefore)>0 ? Math.round((gainKw/draft.powerBefore)*100) : 0;
        panel.innerHTML = `
          <div class="grid g2">
            ${H.field('Stage',H.sel('stage',draft.stage,BUSINESS.vocab.stages))}
            ${H.field('Tuning type',H.sel('tuningType',draft.tuningType,BUSINESS.vocab.tuningTypes))}
            ${H.field('Validated on',H.sel('validation',draft.validation,BUSINESS.vocab.validation))}
            ${H.field('Date completed',`<input class="inp" data-k="completedAt" type="date" value="${draft.completedAt?new Date(draft.completedAt).toISOString().slice(0,10):''}">`)}
          </div>
          <div class="sep"></div>
          <div class="grid g2">
            ${H.field('Power before, kW',`<input class="inp" data-k="powerBefore" type="number" min="0" value="${draft.powerBefore}">`)}
            ${H.field('Power after, kW',`<input class="inp" data-k="powerAfter" type="number" min="0" value="${draft.powerAfter}">`)}
            ${H.field('Torque before, Nm',`<input class="inp" data-k="torqueBefore" type="number" min="0" value="${draft.torqueBefore}">`)}
            ${H.field('Torque after, Nm',`<input class="inp" data-k="torqueAfter" type="number" min="0" value="${draft.torqueAfter}">`)}
          </div>
          <div class="sep"></div>
          <div class="grid" style="gap:12px">
            <div class="note">${ICON.info}<div>Only publish figures you can back with a dyno sheet or V-Box run. These are the numbers customers will quote back to you.</div></div>
            <div class="card" style="box-shadow:none;background:var(--glass)"><div class="card-b">
              <div class="kv">
                <div class="kv-row"><span>Power gain</span><b>${gainKw>0?'+'+U.num(gainKw)+' kW'+(pct?' ('+pct+'%)':''):'Not set'}</b></div>
                <div class="kv-row"><span>Torque gain</span><b>${gainNm>0?'+'+U.num(gainNm)+' Nm':'Not set'}</b></div>
                <div class="kv-row"><span>Validated on</span><b>${U.esc(draft.validation||'Not set')}</b></div>
              </div>
            </div></div>
          </div>`;
      }
      if(tab==='images'){
        panel.innerHTML = `
          <div class="grid" style="gap:14px">
            <div class="note">${ICON.info}<div>Add up to 6 photos. The first photo is the main image on your website, so make it the best shot of the finished car. Drag any photo to change the order.</div></div>
            <div id="bUp"></div>
          </div>`;
        UI.uploader(U.el('#bUp',panel),{
          max:6, images:draft.images, bucket:BUSINESS.buckets.primary, label:'Drop build photos here or tap to browse',
          hint:'Landscape photos look best. Dyno graphs work well too.',
          onChange:imgs=>{ draft.images = imgs; const c=U.el('[data-imgc]',m.el); if(c) c.textContent = imgs.length; }
        });
      }
      if(tab==='content'){
        panel.innerHTML = `
          <div class="grid" style="gap:16px">
            ${H.field('Write-up',H.ta('description',draft.description,'Describe the build, what the customer wanted and what you fitted.',7),'Mention the hardware, the calibration approach and how it was validated.')}
            ${H.field('Work done',`<div id="bWork"></div>`,'Type an item and press Enter. These show as a tick list on your website.')}
            <div class="row">
              <button class="btn btn-sm" data-quick="Downpipe">Add downpipe</button>
              <button class="btn btn-sm" data-quick="Full exhaust system">Add exhaust</button>
              <button class="btn btn-sm" data-quick="Intercooler upgrade">Add intercooler</button>
              <button class="btn btn-sm" data-quick="Intake / induction upgrade">Add intake</button>
              <button class="btn btn-sm" data-quick="Hybrid turbo">Add hybrid turbo</button>
              <button class="btn btn-sm" data-quick="Water-Methanol Injection (WMI)">Add WMI</button>
            </div>
          </div>`;
        const tg = UI.tags(U.el('#bWork',panel),draft.workDone,list=>draft.workDone=list);
        U.on(panel,'click','[data-quick]',(e,btn)=>{
          const val = btn.dataset.quick;
          if(draft.workDone.indexOf(val)<0){ draft.workDone.push(val); tg.get(); paint(); }
          else UI.toast('warn','Already added',val+' is already on the list.');
        });
      }
      if(tab==='status'){
        panel.innerHTML = `
          <div class="grid" style="gap:11px">
            ${H.toggleCard('published',draft.published,'Published','Show this build on your website','ok','check')}
            ${H.toggleCard('featured',draft.featured,'Featured build','Show this build on your homepage','','star')}
            ${H.toggleCard('archived',draft.archived,'Archived','Hides the build from your website completely','','archive')}
            <div class="sep"></div>
            ${H.field('Build views',`<input class="inp" data-k="views" type="number" min="0" value="${draft.views||0}">`,'Used in your analytics.')}
          </div>`;
      }
      H.bind(panel,(k,val)=>{
        if(k==='completedAt'){ draft.completedAt = val ? new Date(val).getTime() : null; return; }
        draft[k] = ['year','powerBefore','powerAfter','torqueBefore','torqueAfter','views'].indexOf(k)>=0 ? Number(val)||0 : val;
        /* Suggest a title from make, model and stage on new builds only. */
        if((k==='make'||k==='model'||k==='stage') && !editing && !draft.title && draft.make && draft.model){
          const n = U.el('[data-k="title"]',panel);
          draft.title = (draft.make+' '+draft.model+(draft.stage?' '+draft.stage:'')).trim();
          if(n) n.value = draft.title;
        }
      },()=>{});
    }

    U.on(m.el,'click','[data-bt]',(e,btn)=>{
      tab = btn.dataset.bt;
      U.els('[data-bt]',m.el).forEach(x=>x.classList.toggle('on',x.dataset.bt===tab));
      paint();
    });

    U.el('[data-bsave]',m.el).addEventListener('click',()=>{
      if(!draft.title.trim() && !(draft.make && draft.model)){
        tab='details';
        U.els('[data-bt]',m.el).forEach(x=>x.classList.toggle('on',x.dataset.bt==='details'));
        paint();
        return UI.toast('err','A title is needed','Give the build a title, or choose a make and model.');
      }
      if(!draft.title.trim()) draft.title = (draft.make+' '+draft.model).trim();
      if(draft.published && Number(draft.powerAfter)>0 && Number(draft.powerBefore)>0 && draft.powerAfter<draft.powerBefore){
        tab='tune';
        U.els('[data-bt]',m.el).forEach(x=>x.classList.toggle('on',x.dataset.bt==='tune'));
        paint();
        return UI.toast('err','Check the power figures','Power after is lower than power before. Swap them or correct the numbers.');
      }
      draft.status = draft.archived ? 'archived' : draft.published ? 'published' : 'draft';
      if(editing){
        Store.update('builds',id,draft);
        Store.log('Build updated',draft.title+' details were edited','edit');
      }else{
        Store.insert('builds',draft);
        const gain = (Number(draft.powerAfter)||0)-(Number(draft.powerBefore)||0);
        Store.log('Build added',draft.title+(gain>0?' at +'+gain+' kW':''),'stage','ok');
      }
      Store.persist(true);
      m.close();
      Router.refresh();
      UI.toast('ok',editing?'Build saved':'Build added',draft.title);
    });

    const del = U.el('[data-bdel]',m.el);
    if(del) del.addEventListener('click',async()=>{
      if(await UI.confirm({title:'Delete this build?',message:draft.title+' and all of its photos will be permanently removed.',confirmText:'Delete build'})){
        Store.remove('builds',id);
        Store.log('Build deleted',draft.title,'trash','dan');
        m.close(); Router.refresh(); UI.toast('ok','Build deleted','');
      }
    });

    paint();
  },

  importAll(file){
    if(!file) return;
    const fr = new FileReader();
    fr.onload = async ()=>{
      let parsed;
      try{ parsed = JSON.parse(fr.result); }
      catch(err){ return UI.toast('err','That file could not be read','Please choose a backup file created by this portal.'); }
      if(!parsed || !parsed.meta || !Array.isArray(parsed.vehicles)){
        return UI.toast('err','That is not a portal backup','The file is missing the expected content.');
      }
      const ok = await UI.confirm({
        title:'Restore this backup?',
        message:'Everything currently in your portal will be replaced with the contents of this file. The backup contains '+parsed.vehicles.length+' vehicles and '+((parsed.enquiries||[]).length)+' enquiries.',
        confirmText:'Restore backup', tone:'warn'
      });
      if(!ok) return;
      Store.data = Store._merge(SEED(),parsed);
      Store.log('Backup restored','Portal data was restored from a backup file','upload','ok');
      Store.persist(true);
      Shell.applyTheme(); Router.buildNav(); Router.go('dashboard');
      UI.toast('ok','Backup restored','Your portal has been updated');
    };
    fr.readAsText(file);
  },

const Router = {
  current:null,

  buildNav(){
    const groups = [];
    Portal.modules.forEach(m=>{
      const g = m.group||'General';
      let grp = groups.find(x=>x.name===g);
      if(!grp){ grp={name:g,items:[]}; groups.push(grp); }
      grp.items.push(m);
    });
    U.el('#sbNav').innerHTML = groups.map(g=>`
      <div class="sb-group">${U.esc(g.name)}</div>
      ${g.items.map(m=>`
        <button class="sb-link" data-nav="${m.id}">
          ${ICON[m.icon]||ICON.dash}
          <span>${U.esc(m.title)}</span>
          <span data-badge="${m.id}"></span>
        </button>`).join('')}
    `).join('');
    U.on(U.el('#sbNav'),'click','[data-nav]',(e,b)=>{
      location.hash = '#/'+b.dataset.nav;
      Shell.closeSidebar();
    });
    this.paintBadges();
  },

  paintBadges(){
    const st = Store.stats();
    Portal.modules.forEach(m=>{
      const slot = U.el(`[data-badge="${m.id}"]`);
      if(!slot) return;
      const b = m.badge ? m.badge(st) : null;
      slot.outerHTML = b
        ? `<span class="sb-badge ${b.mut?'mut':''}" data-badge="${m.id}">${U.esc(b.text)}</span>`
        : `<span data-badge="${m.id}"></span>`;
    });
    const bell = U.el('#bellDot');
    if(bell) bell.style.display = st.unread ? 'block' : 'none';
  },

  go(id,params){
    const mod = Portal.byId[id] || Portal.modules[0];
    this.current = mod.id;
    U.els('.sb-link').forEach(b=>b.classList.toggle('on',b.dataset.nav===mod.id));
    U.el('#tbTitle').innerHTML = `${U.esc(mod.title)}<small>${U.esc(mod.sub||'')}</small>`;
    const view = U.el('#view');
    view.classList.remove('anim');
    view.innerHTML = UI.skeleton(mod.skeleton||'list',5);
    document.title = mod.title+' · '+BUSINESS.name+' '+BUSINESS.portalLabel;
    setTimeout(()=>{
      view.innerHTML = mod.render(params||{});
      void view.offsetWidth;
      view.classList.add('anim');
      if(mod.mount) mod.mount(view,params||{});
      UI.animateAll(view);
      Router.paintBadges();
      window.scrollTo({top:0,behavior:'instant'});
    }, mod.instant?0:150);
  },

  refresh(){ if(this.current) this.go(this.current); },

  start(){
    const read = ()=>{
      const h = (location.hash||'').replace(/^#\/?/,'');
      const [id,q] = h.split('?');
      const params = {};
      (q||'').split('&').filter(Boolean).forEach(p=>{
        const [k,v]=p.split('='); params[decodeURIComponent(k)]=decodeURIComponent(v||'');
      });
      this.go(id||'dashboard',params);
    };
    window.addEventListener('hashchange',read);
    read();
  }
};

const Shell = {

    if(t) t.innerHTML = U.esc(BUSINESS.name)+'<span>'+U.esc(BUSINESS.portalLabel)+'</span>';
    document.title = BUSINESS.name+' '+BUSINESS.portalLabel;
  },

  /* Publish on first connect, then keep quiet. Never blocks the UI. */
  async afterAuth(){
    const r = await Cloud.ensureSeeded();
    if(r && r.seeded){
      const n = Object.values(r.counts||{}).reduce((a,b)=>a+b,0);
      UI.toast('ok','Website content published',n+' records are now live in your database');
      Router.refresh();
    }else if(r && r.skipped==='not-owner'){
      UI.toast('warn','Not on the owner allowlist','Run add-me-as-owner.sql, then sign in again');
    }
    Shell.paintStatus();
    return r;
  },

  openSidebar(){ U.el('#sidebar').classList.add('on'); U.el('#scrim').classList.add('on'); },
  closeSidebar(){ U.el('#sidebar').classList.remove('on'); U.el('#scrim').classList.remove('on'); },
  applyTheme(){
    const a = Store.data.appearance;
    document.documentElement.style.setProperty('--accent',a.accent||BUSINESS.brand.accent);
    document.documentElement.style.setProperty('--accent-glow',(a.accent||BUSINESS.brand.accent)+'6B');
    document.documentElement.style.setProperty('--accent-soft',(a.accent||BUSINESS.brand.accent)+'24');
    document.documentElement.style.setProperty('--success',a.success||BUSINESS.brand.success);
  },
  login(){
    if(!Cloud.authed) return Shell.lock();      /* never open the portal unauthenticated */
    U.el('#login').classList.add('hide');
    U.el('#app').classList.add('on');
    Router.buildNav();
    Router.start();
    Shell.paintStatus();
    U.el('.sb-user b').textContent = Cloud.email.split('@')[0] || 'Owner';
    U.el('.sb-user small').textContent = Cloud.email || 'Signed in';
    /* send anything queued, then load the latest content from the database */
    if(Cloud.authed){
      Cloud.flush()
        .then(()=>Cloud.pullAll())
        .then(res=>{
          if(res && res.blocked){
            Modules.ownerHelp();
            return;
          }
          if(res && res.empty){
            UI.toast('warn','Your database is empty','Open Database and push your content to fill it');
            return;
          }
          Shell.applyTheme(); Router.refresh();
          UI.toast('ok','Loaded from database','Your content is up to date');
        })
        .catch(err=>{
          Cloud.setStatus('offline',err.message);
          UI.toast('warn','Working offline','Showing the last copy saved on this device');
        });
    }
  },
  async logout(){
    const btn = U.el('#btnLogout');
    if(btn) btn.innerHTML = ICON.refresh;
    await Cloud.signOut();                       /* revokes the token server side */
    Shell.lock();
  },

  /* Shows the login screen and closes the portal behind it. */
  lock(message){
    U.el('#app').classList.remove('on');
    U.el('#login').classList.remove('hide');
    const p = U.el('#loginPass'); if(p) p.value='';
    U.el('#loginErr').textContent = message || '';
    Shell.paintLogin();
  },

  paintLogin(){
    const em = (Cloud.session && Cloud.session.email) || Shell.lastEmail || '';
    if(em) U.el('#loginEmail').value = em;

    /* Two states on one screen: connect the project, then sign in. */
    const ready = Cloud.on;
    U.el('#setupForm').classList.toggle('hide',ready);
    U.el('#loginForm').classList.toggle('hide',!ready);
    U.el('#loginForgot').classList.toggle('hide',!ready);
    U.el('#loginSub').textContent = ready
      ? 'Sign in with your Supabase account to manage the '+BUSINESS.name+' website.'
      : 'First, connect this portal to your Supabase project. You only do this once on this device.';
    U.el('#loginHint').innerHTML = ready
      ? 'Secured by Supabase Authentication.'
      : 'Project Settings, API in your Supabase dashboard.';
    if(ready && Cloud.cfg) U.el('#setupUrl').value = Cloud.cfg.url;
  },

  paintStatus(){
    const pill = U.el('#syncPill');
    if(!pill) return;
    const s = Cloud.status;
    const cls = s==='online'?'':s==='syncing'?'acc':s==='offline'?'warn':'dan';
    const txt = s==='online'?'Synced':s==='syncing'?'Syncing':s==='offline'?'Offline':'Sign in needed';
    const title = Cloud.statusLabel()+(Cloud.queue.length?' ('+Cloud.queue.length+' waiting)':'')+(Cloud.lastError?'. '+Cloud.lastError:'');
    pill.className = 'live '+cls;
    pill.title = title;
    U.el('span',pill).textContent = txt;
  },
  init(){
    Shell.applyTheme();
    U.el('#burger').addEventListener('click',Shell.openSidebar);
    U.el('#scrim').addEventListener('click',Shell.closeSidebar);
    U.el('#btnLogout').addEventListener('click',async()=>{
      const pending = Cloud.queue.length;
      const msg = pending
        ? pending+' change'+(pending===1?'':'s')+' have not reached the database yet. Signing out now keeps them queued on this device until you sign back in.'
        : 'Everything is saved to your database. You will need your email and password to sign back in.';
      if(await UI.confirm({title:'Sign out?',message:msg,confirmText:'Sign out',tone:'warn'})) Shell.logout();
    });
    U.el('#btnPreview').addEventListener('click',()=>window.open(BUSINESS.website,'_blank','noopener'));
    U.el('#btnBell').addEventListener('click',()=>Modules.notifications());

    /* The only way into the portal: Supabase Authentication. This posts to
       /auth/v1/token?grant_type=password, which is exactly what the SDK's
       signInWithPassword() calls. No SDK, so the portal stays one file. */
    U.el('#setupForm').addEventListener('submit',async e=>{
      e.preventDefault();
      const err = U.el('#setupErr');
      const btn = U.el('#setupBtn');
      const url = Cloud.normaliseUrl(U.el('#setupUrl').value);
      const key = U.el('#setupKey').value.trim();

      if(!/^https:\/\/.+\..+/.test(url)) return err.textContent = 'That does not look like a project URL. It should read https://yourproject.supabase.co';
      if(!key) return err.textContent = 'Paste the publishable key from Project Settings, API.';

      btn.disabled = true; btn.textContent = 'Checking...'; err.textContent = '';
      const prev = Cloud.cfg;
      try{
        Cloud.setCfg(url,key);
        /* Auth health is the cheapest call that proves both the URL and
           the key. It needs no account, so it isolates a bad connection
           from a bad password. */
        const res = await fetch(url+'/auth/v1/health',{headers:{apikey:key}});
        if(res.status===401) throw new Error('That key was rejected. Copy the publishable key again from Project Settings, API.');
        if(!res.ok) throw new Error('The project answered with status '+res.status+'. Check the URL is your project address.');
        Shell.paintLogin();
        U.el('#loginEmail').focus();
        UI.toast('ok','Project connected','Now sign in with your Supabase account');
      }catch(ex){
        if(prev) Cloud.setCfg(prev.url,prev.key); else Cloud.cfg = null;
        err.textContent = /Failed|NetworkError|Load failed/i.test(ex.message)
          ? 'Could not reach that address. Check the project URL for typos.'
          : ex.message;
      }finally{
        btn.disabled = false; btn.textContent = 'Connect project';
      }
    });

    U.el('#loginForm').addEventListener('submit',async e=>{
      e.preventDefault();
      const err = U.el('#loginErr');
      const btn = U.el('#loginBtn');
      const email = U.el('#loginEmail').value.trim();
      const pass = U.el('#loginPass').value;

      if(!email) return err.textContent = 'Enter your email address.';
      if(!pass) return err.textContent = 'Enter your password.';

      btn.disabled = true; btn.textContent = 'Signing in...'; err.textContent = '';
      try{
        await Cloud.signIn(email,pass);
        Shell.lastEmail = email;
        Shell.login();
        setTimeout(()=>UI.toast('ok','Signed in',email),500);
        Shell.afterAuth();
      }catch(ex){
        err.textContent =
          /invalid|credential|grant/i.test(ex.message) ? 'That email and password do not match an account. Check for typos, or reset your password below.'
          : /confirm/i.test(ex.message) ? 'That account has not been confirmed yet. In Supabase, open Authentication, Users, and confirm it.'
          : /not connected to a Supabase project/i.test(ex.message) ? ex.message
          : /connection|internet/i.test(ex.message) ? 'Cannot reach the database. Check your internet and try again.'
          : ex.message;
        U.el('#loginPass').select();
      }finally{
        btn.disabled = false; btn.textContent = 'Sign in';
      }
    });

    U.el('#loginForgot').addEventListener('click',async()=>{
      const email = U.el('#loginEmail').value.trim();
      const err = U.el('#loginErr');
      if(!email) return err.textContent = 'Enter your email address first, then tap Forgot your password.';
      try{
        await Cloud.sendReset(email);
        err.textContent = '';
        UI.toast('ok','Reset email sent','Check '+email+' for a link to set a new password');
      }catch(ex){ err.textContent = ex.message; }
    });

    U.el('#syncPill').addEventListener('click',()=>{
      if(!Cloud.on) return location.hash = '#/database';
      if(Cloud.queue.length){ Cloud.flush(); UI.toast('info','Syncing now',Cloud.queue.length+' changes waiting'); }
      else location.hash = '#/database';
    });
    Shell.paintLogin();

    const gs = U.el('#globalSearch');
    document.addEventListener('keydown',e=>{
      if(e.key==='/' && document.activeElement.tagName!=='INPUT' && document.activeElement.tagName!=='TEXTAREA'){
        e.preventDefault(); gs.focus();
      }
    });
    gs.addEventListener('keydown',e=>{
      if(e.key==='Enter' && gs.value.trim()){
        location.hash = '#/builds?q='+encodeURIComponent(gs.value.trim());
        gs.blur();
      }
    });

    Store.on('*',()=>Router.paintBadges());
  }
};

/* ==================================================================
   BOOT
   ================================================================== */
Shell.applyBrand();  /* names the shell from BUSINESS before anything paints */
Cloud.init();        /* must run before the store, which mirrors writes to it */
Store.init();
Shell.init();

(function boot(){
  const bar = U.el('#bootBar');
  let p = 0;
  const t = setInterval(()=>{
    p = Math.min(100, p + 14 + Math.random()*20);
    bar.style.width = p+'%';
    if(p>=100){
      clearInterval(t);
      setTimeout(()=>{
        U.el('#boot').classList.add('done');
        /* A stored Supabase session reopens the portal straight away and
           survives a refresh. No session means the login screen, always. */
        if(Cloud.authed){
          Shell.login();
          /* renew the token if this session has been sitting for a while */
          if(Date.now() - (Cloud.session.at||0) > 40*60*1000) Cloud.refresh();
          /* Covers the returning owner who never signs in again. */
          Shell.afterAuth();
        }else{
          Shell.paintLogin();
          U.el('#login').classList.remove('hide');
        }
      },260);
    }
  },130);
})();

/* expose for console debugging and future integrations */
window.VenomPortal = { BUSINESS, Store, Portal, Router, Shell, UI, U, DB, Cloud, Assets, Modules, MAP, SCHEMA_SQL };

})();
</script>
